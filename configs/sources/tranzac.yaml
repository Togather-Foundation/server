name: "tranzac"
# Tranzac Club (Toronto). Nuxt.js + DatoCMS SPA.
# Tier 3 (GraphQL): queries DatoCMS directly for structured event data with ISO dates.
# Public read-only token from /calendar runtime public.datoCmsToken (verified 2026-11-10).
url: "https://tranzac.org/calendar"
tier: 3
schedule: "daily"
trust_level: 7
license: "CC0-1.0"
domain: music
enabled: true
# Room rental holds are not public events.
exclude_url_pattern: '/events/private-booking-'
exclude_title_pattern: '(?i)^private booking$'
graphql:
  endpoint: "https://graphql.datocms.com/"
  token: "6478acdbc92845767c38d53f0c1c81"
  query: |
    {
      allEvents {
        title
        startDate
        endDate
        slug
        description
        photo { url }
        rooms { name }
      }
    }
  event_field: "allEvents"
  timeout_ms: 30000
  url_template: "https://tranzac.org/events/{{.slug}}"
