name: "music-toronto"
# Tier 1 (Colly CSS selectors). Squarespace event listing. Config pre-existed
# (validated 2026-02-21, 35 events); re-validated 2026-08-15: 13 events, and
# date_selectors added to fix all_midnight (times now extracted).
# Organization match: API unavailable
url: "https://musictorontoconcerts.com/concerts/"
tier: 1
schedule: "daily"
trust_level: 7
license: "CC0-1.0"
domain: music
enabled: true
max_pages: 3
# Music Toronto concerts are held at various Toronto venues; when the listing
# page omits a venue (common for season preview pages) use Music Toronto's
# home base as the fallback location.
default_location:
  name: "Music Toronto"
  address_locality: "Toronto"
  address_region: "ON"
  address_country: "CA"
selectors:
  event_list: "article.eventlist-event"
  name: "h1.eventlist-title"
  url: "a.eventlist-column-thumbnail"
  # date_selectors take priority over start_date/end_date; the Squarespace
  # event block splits date and times into separate <time> elements.
  date_selectors:
    - "time.event-date"
    - "time.event-time-localized-start"
    - "time.event-time-localized-end"
