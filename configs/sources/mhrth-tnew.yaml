name: "mhrth-tnew"
# ENABLED — validated live 2026-08-15 with the POST + flatten engine support
# (t_e2df1749, t_d2875da0): dry-run returned 102 performances across 77
# productions with correct RFC3339 dates and ticket URLs.
#
# API DISCOVERED (2026-08-15, task t_88b37fea): the shared ticketing platform
# behind Massey Hall / Roy Thomson Hall / Allied Music Centre is Tessitura TNEW
# (Tessitura 16.0.26, TNEW 16.0.46), served from mass-tnew-prod.tnhs.cloud.
# One instance covers ALL venues of the org (Allied Music Centre = parent of
# Massey Hall, Roy Thomson Hall, TD Music Hall, AMC Theatre).
#
# Endpoint (VERIFIED WORKING, no auth):
#   POST https://mass-tnew-prod.tnhs.cloud/api/products/productionseasons
#   Content-Type: application/json
#   Body: {"startDate":"2026-08-15T00:00","endDate":"2028-08-15T00:00",
#          "productionSeasonIdFilter":[],"keywordIds":null}
#   Returns {"productions":[{productionSeasonId, productionTitle,
#     listingImageUrl, description, productionSeasonActionUrl,
#     performances:[{id, iso8601DateString, displayDate, displayTime,
#     performanceTitle, actionUrl, isOnSale, ...}]}]}
#   Verified: 77 productions / 102 performances over the 2-year window.
#
# Shape: events (dates) live in productions[].performances[] — each performance
# is an event. With results_field: productions + flatten: true, the extractor
# descends into the productions wrapper array and collects the nested
# performances[] leaves as the event list (the production wrappers are not
# events). field_map below targets the performance leaf dicts. description is a
# production-level field absent from performance leaves and resolves empty.
#
# Existing coverage: roy-thomson-hall.yaml + roy-thomson-massey-hall.yaml
# (Tier 2 headless, .c-card--event selectors) cover RTH + Massey; nothing
# covers TD Music Hall / AMC Theatre.
url: "https://mass-tnew-prod.tnhs.cloud/"
tier: 3
schedule: "daily"
trust_level: 8
license: "CC0-1.0"
domain: music
enabled: true
# The feed carries no per-event venue data and the instance covers 4 halls, so
# all events attribute to the parent org venue (Allied Music Centre). Known
# limitation: hall-specific attribution is not possible from this API.
default_location:
  name: "Allied Music Centre"
  street_address: "80 Simcoe St"
  address_locality: "Toronto"
  address_region: "ON"
  postal_code: "M5H 4H2"
  address_country: "CA"
rest:
  endpoint: "https://mass-tnew-prod.tnhs.cloud/api/products/productionseasons"
  method: POST
  # Verified request body: 2-year window, no filter.
  body: '{"startDate":"2026-08-15T00:00","endDate":"2028-08-15T00:00","productionSeasonIdFilter":[],"keywordIds":null}'
  content_type: "application/json"
  results_field: "productions"
  flatten: true
  field_map:
    name: "performanceTitle"
    start_date: "iso8601DateString"
    url: "actionUrl"
