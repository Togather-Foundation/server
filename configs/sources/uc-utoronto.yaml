name: "uc-utoronto"
# University College, University of Toronto — events listing.
# Platform: Drupal 10 behind Cloudflare (managed challenge, fingerprint-based).
#
# STATUS: BLOCKED on this box — needs the opencode/headless pass (see headless block).
# Evidence (2026-08-15):
#   - Plain curl (default UA) returns 200 / 92KB static HTML — the page is fully
#     server-rendered, NO JS required for content.
#   - Cloudflare managed challenge is UA/fingerprint-based: curl UA passes 6/6,
#     but browser-like UAs, Go-http-client, and the scraper's default
#     Togather-SEL-Scraper UA all get 403 "Just a moment..." every time.
#   - `./server scrape inspect <URL>` → 403; `scrape source --dry-run` → 403.
#   - No JSON:API (404), no _format=json route (406), no ICS/ical feed (all 404),
#     so Tier 0/3 are not available.
#   - Tier 1 has NO config-level UA/header override: top-level `headers:` only
#     applies to extraction_method: ics; `tls_fingerprint:` is only consumed by
#     graphql/ics/rest paths (verified in internal/scraper/config.go + ingest.go),
#     NOT by the Colly Tier-1 client.
#
# Selectors below are VALIDATED against the real page HTML (served locally via
# test-fixture workflow): 7/7 events extracted with non-empty names, dates
# parsed (current-year assumption), URLs correct. only warning: all_midnight
# (listing cards carry month+day text only — "Aug 30" / "Aug 31 to Sep 1" —
# no <time>, no datetime attr, no year, no time-of-day). Acceptable for an
# institutional listing (same precedent as art-museum-utoronto).
#
# NEXT STEP (opencode/headless pass): flip to tier: 2 with the headless block
# below. `undetected: true` is the documented Cloudflare managed-challenge
# bypass; wait_selector targets the event container that exists after render.
#
# Organization match: API unavailable
url: "https://www.uc.utoronto.ca/about-connect-us-events"
tier: 1
schedule: "daily"
trust_level: 8
license: "CC0-1.0"
domain: education
enabled: false
max_pages: 3
# headless:                       # ← uncomment + set tier: 2 on the headless box
#   wait_selector: "div.o-listing__list-item"
#   wait_timeout_ms: 20000
#   undetected: true
#   rate_limit_ms: 1000
selectors:
  event_list: "div.o-listing__list-item"
  name: "h2 a"
  start_date: ".m-calendar-item__date"
  url: "h2 a"
