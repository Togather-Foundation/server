name: "tpl-career-job-search"
# Toronto Public Library - Career & Job Search category (resume, interview, job-search workshops).
# BiblioCommons events RSS (extraction_method: bibliocommons_rss). The RSS feed is the
# surface BiblioCommons' terms expressly permit for automated access ("except as may be
# specifically permitted using RSS/XML feeds"); the HTML listing is NOT, so do not
# scrape tpl.bibliocommons.com/v2/events for this. The feed carries venue address +
# coordinates, local start/end times, registration state, virtual flag and cancelled
# flag (cancelled events are skipped), and is filtered server-side by the query below.
# Filter ids (BiblioCommons, TPL): types=68b050d1023ff32800756704 Career & Job Search,
# types=68caafcb023ff32800799b52 Artificial Intelligence, programs=68b0553aedabb62f00e295f3
# Career Coaches in Residence, programs=68b0559e101e8736007ad740 Innovator in Residence.
# 25 items per page; max_pages is headroom, paging stops at the first empty page.
#
# ENABLED: false until the licence/terms decision is made — see
# docs/integration/event-platforms.md "BiblioCommons (public libraries)".
# Organization: the feed channel title ("Events | Toronto Public Library") becomes the organizer.
url: "https://gateway.bibliocommons.com/v2/libraries/tpl/rss/events?types=68b050d1023ff32800756704"
extraction_method: bibliocommons_rss
schedule: "daily"
trust_level: 8
license: "CC0-1.0"
domain: education
timezone: "America/Toronto"
enabled: false
max_pages: 6
