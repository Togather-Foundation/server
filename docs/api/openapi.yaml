                    negative value means the key does not expire; admin keys are
                    expected to set it and the CLI enforces this.
                federation_node_id:
                  type: [string, 'null']
                  format: uuid
                  description: |
                    Bind the key to a federation node. A bound key may submit
                    inbound federation sync payloads minted by that node only;
                    unbound keys are rejected by `POST /api/v1/federation/sync`
                    with `403`. The node must already exist.
      responses:
        '201':
          description: API key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'

