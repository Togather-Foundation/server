  /api/v1/admin/scraper/sources/{name}/trigger:
    post:
      operationId: triggerScraperSource
      summary: Trigger an immediate scrape for a source
      description: |
        Dispatches a background scrape for the named source and returns 202
        immediately. Returns 503 if this node has no scraper configured, and 404
        if the source name is unknown.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Scraper source name
          schema:
            type: string
      responses:
        '202':
          description: Scrape triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_name:
                    type: string
                  status:
                    type: string
                    example: triggered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/problem+json:
