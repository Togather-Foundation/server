  /api/v1/admin/identity/conflicts:
    get:
      operationId: listIdentityConflicts
      summary: List identity conflicts
      description: |
        Lists unordered pairs of entities that share an external identifier (a self-join
        of entity_identifiers on equal authority/URI). Pairs whose stored evidence
        fingerprint still matches the current shared signals are marked `suppressed` and
        excluded by default; pass `include_suppressed=true` to include them with their
        `prior_decision`. The maximum `limit` is configurable via
        `IDENTITY_CONFLICT_LIMIT_MAX` (default 200).
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          description: Entity type to scan for conflicts
          schema:
            type: string
            enum: [place, organization]
        - name: include_suppressed
          in: query
          description: Include suppressed pairs with their prior_decision (default false)
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous response's `next_cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum results per page (default 50, max configurable via IDENTITY_CONFLICT_LIMIT_MAX, default 200)
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: Paginated list of identity conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
