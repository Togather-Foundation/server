          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/identity/decisions:
    get:
      operationId: listIdentityDecisions
      summary: List identity decisions
      description: |
        Returns the append-only identity decisions feed, newest first. Optionally filter
        by entity type and an inclusive `since` RFC3339 lower bound on `created_at`. The
        maximum `limit` is configurable via `IDENTITY_CONFLICT_LIMIT_MAX` (default 200).
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by entity type
          schema:
            type: string
            enum: [place, organization]
        - name: since
          in: query
          description: Inclusive RFC3339 lower bound on decision `created_at`
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous response's `next_cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum results per page (default 50, max configurable via IDENTITY_CONFLICT_LIMIT_MAX, default 200)
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: Paginated list of identity decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/identity/link:
    post:
      operationId: linkIdentifier
      summary: Record an identifier link decision
      description: |
        Records/confirms an external identifier observation for one SEL entity and
        elects the primary, appending a `link` decision. The `actor` is taken from the
        admin JWT subject, never the request body. Client-supplied `method`/`source` are
        restricted to the Phase 1 allow-list (`manual`); anything else is normalised to
        `manual`. `confidence` is clamped to `[0,1]` and never affects the method rank.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        description: Link request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLinkRequest'
      responses:
        '201':
          description: Link decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/identity/reject:
    post:
      operationId: rejectIdentifier
      summary: Record a reject decision
      description: |
        Records that two entities are judged distinct, appending a `reject` decision and
        suppressing the pair unless its evidence fingerprint changes. The evidence
        fingerprint is computed server-side from current observations, not client-supplied.
        The `actor` is taken from the admin JWT subject, never the request body.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        description: Reject request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRejectRequest'
      responses:
        '201':
          description: Reject decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/login:
    post:
      operationId: login
      summary: Admin login
      description: Authenticate admin user and receive JWT token
      tags: [Admin]
      x-internal: true
      requestBody:
        description: Admin credentials (email and password) for authentication
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/token:
    post:
      operationId: exchangeApiKey
      summary: Exchange admin API key for JWT token
      description: >
        Exchange an admin-role API key for a short-lived JWT token.
        The JWT lifetime is configurable via AUTH_TOKEN_EXCHANGE_EXPIRY_MINUTES
        (default 60). Rate limited to 5 attempts per 15-minute window per IP
        (configurable via RATE_LIMIT_LOGIN, default 5).
      tags: [Auth]
      security:
        - apiKey: []
      responses:
        '200':
          description: Token exchange successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Short-lived JWT token for admin API access
                  expires_at:
                    type: string
                    format: date-time
                    description: UTC timestamp when the token expires (RFC3339)
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many requests (rate limit exceeded)

  /api/v1/admin/developers/invite:
    post:
      operationId: inviteDeveloper
      summary: Invite a developer
      description: Send an invitation to a developer by email. The developer receives an email with a link to accept the invitation.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        description: Developer invitation details
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Developer's email address
                name:
                  type: string
                  description: Optional developer name
                max_keys:
                  type: integer
                  default: 5
                  minimum: 1
                  maximum: 20
                  description: Maximum API keys this developer can create
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  status:
                    type: string
                    enum: [invited]
                  invitation_expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/developers:
    get:
      operationId: listDevelopers
      summary: List all developers
      description: Retrieve a list of all developers with their API key count and usage statistics
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by developer status
          schema:
            type: string
            enum: [active, invited, deactivated]
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: List of developers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Developer'
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/developers/{id}:
    get:
      operationId: getDeveloper
      summary: Get developer details
      description: Retrieve details for a specific developer including their API keys
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Developer UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Developer details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Developer'
                  - type: object
                    properties:
                      api_keys:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeveloperAPIKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateDeveloper
      summary: Update developer settings
      description: Update developer's max_keys or is_active status
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Developer UUID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Developer settings to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_keys:
                  type: integer
                  minimum: 1
                  maximum: 20
                is_active:
                  type: boolean
      responses:
        '200':
          description: Developer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Developer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteDeveloper
      summary: Deactivate developer
      description: Deactivate developer and revoke all their API keys
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Developer UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Developer deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/reports/daily-usage:
    get:
      operationId: getDailyUsageReport
      tags: [Admin]
      summary: Daily usage report
      description: |
        Returns API-key usage statistics for a date range, summarizing request and error
        counts aggregated by API key and client IP. Owner-associated traffic is excluded
        via the DAILY_REPORT_EXCLUDE_IPS env var (configurable via DAILY_REPORT_EXCLUDE_IPS, default empty)
        or the optional exclude_ips query parameter. Only data recorded since the
        deployment of per-IP tracking (api_key_usage_ips table) is included; this
        report is forward-looking.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Start date (YYYY-MM-DD). Defaults to today in the configured timezone.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: End date (YYYY-MM-DD). Defaults to `from`.
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 3 }
          description: Number of top keys and IPs to return.
        - name: exclude_ips
          in: query
          schema: { type: string }
          description: Comma-separated list of IPs to exclude. Overrides the DAILY_REPORT_EXCLUDE_IPS env var.
      responses:
        '200':
          description: Daily usage report
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  totals:
                    type: object
                    properties:
                      requests: { type: integer, format: int64 }
                      errors: { type: integer, format: int64 }
                      error_rate_pct: { type: number }
                      active_api_keys: { type: integer }
                      active_developers: { type: integer }
                  distribution:
                    type: object
                    properties:
                      requests_per_key_avg: { type: number }
                      requests_per_key_median: { type: integer, format: int64 }
                  top_keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key_name: { type: string }
                        key_prefix: { type: string }
                        developer_name: { type: string }
                        developer_email: { type: string }
                        requests: { type: integer, format: int64 }
                        errors: { type: integer, format: int64 }
                  top_ips:
                    type: array
                    items:
                      type: object
                      properties:
                        ip: { type: string }
                        requests: { type: integer, format: int64 }
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        requests: { type: integer, format: int64 }
                        errors: { type: integer, format: int64 }
                  trouble:
                    type: object
                    properties:
                      top_error_keys:
                        type: array
                        items:
                          type: object
                          properties:
                            key_name: { type: string }
                            key_prefix: { type: string }
                            developer_name: { type: string }
                            developer_email: { type: string }
                            requests: { type: integer, format: int64 }
                            errors: { type: integer, format: int64 }
                      flag:
                        type: [string, 'null']
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/dev/login:
    post:
      operationId: developerLogin
      summary: Developer login
      description: Authenticate developer with email/password and receive JWT token. Rate limited to 5 attempts per 15-minute window per IP (configurable via `RATE_LIMIT_LOGIN`, default 5).
      tags: [Developer]
      security: []
      requestBody:
        description: Developer credentials
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for API access
                  expires_at:
                    type: string
                    format: date-time
                  developer:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      name:
                        type: string
                      github_username:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many login attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/dev/logout:
    post:
      operationId: developerLogout
      summary: Developer logout
      description: Clear dev_auth_token cookie
      tags: [Developer]
      security:
        - devCookie: []
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/dev/api-keys:
    get:
      operationId: listDeveloperApiKeys
      summary: List own API keys
      description: Retrieve all API keys belonging to the authenticated developer with usage summary
      tags: [Developer]
      security:
        - devCookie: []
        - devJWT: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeveloperAPIKey'
                  max_keys:
                    type: integer
                    description: Maximum keys allowed for this developer
                  key_count:
                    type: integer
                    description: Current number of keys
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createDeveloperApiKey
      summary: Create a new API key
      description: Create a new API key for the authenticated developer. Enforces max_keys limit.
      tags: [Developer]
      security:
        - devCookie: []
        - devJWT: []
      requestBody:
        description: API key details
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Human-readable name for the key
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAPIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Max keys exceeded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/dev/api-keys/{id}:
    delete:
      operationId: revokeDeveloperApiKey
      summary: Revoke own API key
      description: Revoke an API key belonging to the authenticated developer
      tags: [Developer]
      security:
        - devCookie: []
        - devJWT: []
      parameters:
        - name: id
          in: path
          required: true
          description: API key UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Key not owned by developer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/dev/api-keys/{id}/usage:
    get:
      operationId: getDeveloperApiKeyUsage
      summary: Get API key usage statistics
      description: Retrieve usage statistics for a specific API key with daily breakdown
      tags: [Developer]
      security:
        - devCookie: []
        - devJWT: []
      parameters:
        - name: id
          in: path
          required: true
          description: API key UUID
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Start date for usage period (ISO 8601 date)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End date for usage period (ISO 8601 date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: API key usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Key not owned by developer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/dev/accept-invitation:
    post:
      operationId: acceptDeveloperInvitation
      summary: Accept developer invitation
      description: Accept an invitation by token and set up developer account with password
      tags: [Developer]
      security: []
      requestBody:
        description: Invitation acceptance details
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token:
                  type: string
                  description: Invitation token from email
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Developer's full name
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Password for future logins (configurable via DEVELOPER_PASSWORD_MIN_LENGTH, default 8)
      responses:
        '200':
          description: Invitation accepted, developer account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for immediate access
                  developer:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      name:
                        type: string
        '400':
          description: Invalid token or weak password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Invitation expired or already used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/github:
    get:
      operationId: githubOAuthStart
      summary: Initiate GitHub OAuth flow
      description: Redirect to GitHub OAuth authorization page with proper state parameter for CSRF protection
      tags: [OAuth]
      security: []
      responses:
        '302':
          description: Redirect to GitHub OAuth
          headers:
            Location:
              description: GitHub OAuth authorization URL
              schema:
                type: string
                format: uri

  /auth/github/callback:
    get:
      operationId: githubOAuthCallback
      summary: GitHub OAuth callback
      description: Handle GitHub OAuth callback, exchange code for token, and create/login developer
      tags: [OAuth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from GitHub
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: CSRF protection state parameter
          schema:
            type: string
      responses:
        '302':
          description: Redirect to developer dashboard on success
          headers:
            Location:
              description: Developer dashboard URL
              schema:
                type: string
                format: uri
        '400':
          description: Invalid state or GitHub error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /healthz:
    get:
      operationId: healthLiveness
      summary: Liveness probe
      description: Check if the service is alive and running. Used by orchestrators (Kubernetes, etc.) to determine if the service should be restarted.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      operationId: healthReadiness
      summary: Readiness probe
      description: Check if the service is ready to accept traffic. Verifies database connectivity and other dependencies.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
        '503':
          description: Service not ready

  /.well-known/sel-profile:
    get:
      operationId: getSELProfile
      summary: SEL node profile discovery
      description: |
        Returns this node's SEL profile information for federation discovery.
        Required by SEL Interoperability Profile §1.7.
      tags: [Health]
      security: []
      responses:
        '200':
          description: SEL profile information
          content:
            application/json:
              schema:
                type: object
                required: [profile, version, node, updated]
                properties:
                  profile:
                    type: string
                    format: uri
                    example: https://togather.foundation/sel/profiles/v0.1
                  version:
                    type: string
                    example: "0.1.0"
                  node:
                    type: string
                    format: uri
                    example: https://toronto.togather.foundation
                  updated:
                    type: string
                    format: date-time
                  timeZone:
                    type: string
                    description: |
                      The node's IANA civil timezone (e.g. America/Toronto) used to render
                      event times in local civil time (configurable via DEFAULT_TIMEZONE,
                      default America/Toronto).

  /api/v1/openapi.json:
    get:
      operationId: getOpenApiSpec
      summary: OpenAPI specification
      description: Retrieve the OpenAPI 3.1 specification for this API in JSON format. Useful for API documentation and client generation.
      tags: [Health]
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 specification
          content:
            application/json:
              schema:
                type: object

  /api/v1/admin/scraper/sources:
    get:
      operationId: listScraperSources
      summary: List scraper sources
      description: |
        Returns all scraper sources with their latest run summary (status, counts,
        error message). Supports optional filtering by enabled state.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: enabled
          in: query
          description: Filter by enabled state. Omit to return all sources.
          schema:
            type: boolean
      responses:
        '200':
          description: List of scraper sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScraperSourceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/problem+json:
