      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin access
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: Admin JWT token in HttpOnly cookie (used by same-origin SSE endpoints)
    devCookie:
      type: apiKey
      in: cookie
      name: dev_auth_token
      description: Developer JWT token in HttpOnly cookie
    devJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Developer JWT token for API access

  parameters:
    eventId:
      name: id
      in: path
      required: true
      description: Event ULID
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    startDate:
      name: startDate
      in: query
      description: >
        Filter events starting on or after this date (ISO8601, e.g. 2026-06-01).
        Defaults to today when neither startDate nor endDate is provided, so past events
        are excluded by default. "Today" is midnight in the server timezone
        (configurable via DEFAULT_TIMEZONE, default America/Toronto).
        Pass an explicit startDate to override.
        Snake_case alias start_date is accepted but triggers a warnings entry in the response.
      schema:
        type: string
        format: date

    endDate:
      name: endDate
      in: query
      description: >
        Filter events starting on or before this date (ISO8601, e.g. 2026-06-30).
        Inclusive of the entire endDate day: events starting any time on that day
        (up to 23:59:59 in the server timezone, configurable via DEFAULT_TIMEZONE,
        default America/Toronto) are included. To restrict to a single day, pass
        the same value for both startDate and endDate.
        Snake_case alias end_date is accepted but triggers a warnings entry in the response.
      schema:
        type: string
        format: date

    city:
      name: city
      in: query
      description: Filter by city/locality.
      schema:
        type: string

    region:
      name: region
      in: query
      description: Filter by region/state.
      schema:
        type: string

    venueId:
      name: venueId
      in: query
      description: >
        Filter by venue ULID.
        Snake_case alias venue_id is accepted but triggers a warnings entry in the response.
      schema:
        type: string

    organizerId:
      name: organizerId
      in: query
      description: >
        Filter by organizer ULID.
        Snake_case alias organizer_id is accepted but triggers a warnings entry in the response.
      schema:
        type: string

    lifecycleState:
      name: state
      in: query
      description: |
        Filter by lifecycle state. `draft` is accepted but intersects the public
        allowlist on public endpoints, so `state=draft` returns an empty result.
        `pending_review` and `deleted` are not accepted values (400). On admin
        endpoints the filter is unfiltered by the public allowlist (soft-deleted
        rows are still never listed).
      schema:
        type: string
        enum: [draft, published, postponed, rescheduled, sold_out, cancelled, completed]

    eventDomain:
      name: domain
      in: query
      description: Filter by event domain
      schema:
        type: string
        enum: [arts, music, culture, sports, community, education, general]

    query:
      name: q
      in: query
      description: Free-text search on name and description. Aliased by `search`.
      schema:
        type: string

    keywords:
      name: keywords
      in: query
      description: Filter by keywords (comma-separated)
      schema:
        type: string

    after:
      name: after
      in: query
      description: |
        Opaque cursor for pagination (obtained from previous response's `next_cursor`).
        Cursors are base64url-encoded strings - treat as opaque, do not parse or modify.
        `cursor` is accepted as an alias for `after` (with a `warnings` entry noting
        the canonical name). The MCP `events`/`places`/`organizations` tools expose this
        value as `cursor`, so REST callers can pass the MCP parameter name directly.
        Example: `MTcwNjg4NjAwMDAwMDAwMDAwMDowMUhZWDNLUVc3RVJUV jlYTkJNMlA4UUpaRg`
      schema:
        type: string
        example: "MTcwNjg4NjAwMDAwMDAwMDAwMDowMUhZWDNLUVc3RVJUV jlYTkJNMlA4UUpaRg"

    limit:
      name: limit
      in: query
      description: Maximum results per page (default 50, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    context:
      name: context
      in: query
      description: |
        JSON-LD @context emission mode for the list response.

        - `item` (default): each item in `items` carries its own `@context` block,
          so consumers can slice individual items out of the array and still
          interpret them as standalone JSON-LD.
        - `document`: a single `@context` is emitted once at the top level of the
          document, scoping every member in `items`. This omits the per-item
          `@context` blocks and roughly halves collection response size — useful
          for clients with fixed output budgets (e.g. MCP/agent tool results).
          To reconstruct standalone JSON-LD items, combine the document-level
          `@context` with any sliced item.
      schema:
        type: string
        enum: [document, item]
        default: item

    localityCity:
      name: city
      in: query
      description: Filter by city/addressLocality.
      schema:
        type: string

    sort:
      name: sort
      in: query
      description: Sort field for place and organization lists.
      schema:
        type: string
        enum: [name, created_at]
        default: created_at

    order:
      name: order
      in: query
      description: Sort direction for place and organization lists.
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    nearPlace:
      name: near_place
      in: query
      description: |
        Place name to geocode and use as the centre of a proximity search.
        Mutually exclusive with `near_lat`/`near_lon`.
      schema:
        type: string

    nearLat:
      name: near_lat
      in: query
      description: Latitude for proximity search. Requires `near_lon`.
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90

    nearLon:
      name: near_lon
      in: query
      description: Longitude for proximity search. Requires `near_lat`.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180

    radius:
      name: radius
      in: query
      description: |
        Proximity search radius in kilometres (maximum 100). Requires
        `near_place` or `near_lat` + `near_lon`. Defaults to 10 km.
      schema:
        type: number
        format: double
        exclusiveMinimum: 0
        maximum: 100
        default: 10

    countrycodes:
      name: countrycodes
      in: query
      description: |
        Comma-separated ISO 3166-1 alpha-2 country codes used when geocoding
        `near_place`. Defaults to the server's configured country list.
      schema:
        type: string
      example: ca

    placeId:
      name: id
      in: path
      required: true
      description: Place ULID
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    organizationId:
      name: id
      in: path
      required: true
      description: Organization ULID
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    userId:
      name: id
      in: path
      required: true
      description: Admin user UUID
      schema:
        type: string
        format: uuid

    nodeId:
      name: id
      in: path
      required: true
      description: Federation node UUID
      schema:
        type: string
        format: uuid

  schemas:
    ConsolidateResponse:
      type: object
      description: Result of an atomic event consolidation operation
      properties:
        event:
          description: The canonical event after consolidation
          $ref: '#/components/schemas/Event'
        lifecycle_state:
          type: string
          enum: [published, pending_review, draft]
          description: Lifecycle state of the canonical event after consolidation
        is_duplicate:
          type: boolean
          description: >
            True if the canonical event was flagged as a near-duplicate of another
            non-retired event during post-consolidation validation.
        is_merged:
          type: boolean
          description: >
            Always false for consolidation (admin intent is preserved, never auto-merged).
        needs_review:
          type: boolean
          description: >
            True if the canonical event was sent to the review queue due to duplicate
            detection or quality issues found during post-consolidation validation.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'
          description: Validation warnings from post-consolidation checks
        retired:
          type: array
          items:
            type: string
          description: ULIDs of events that were successfully retired (soft-deleted)
        review_entries_dismissed:
          type: array
          items:
            type: integer
          description: IDs of review queue entries that were dismissed for retired events

    OccurrenceInput:
      type: object
      description: Input for creating or updating an event occurrence
      properties:
        start_time:
          type: string
          format: date-time
          description: Start time of the occurrence (RFC3339)
        end_time:
          type: [string, 'null']
          format: date-time
          description: End time of the occurrence (RFC3339), or null to clear
        door_time:
          type: [string, 'null']
          format: date-time
          description: Door open time (RFC3339), or null to clear
        timezone:
          type: string
          description: IANA timezone identifier (e.g. America/New_York)
        all_day:
          type: boolean
          description: >
            Marker for an all-day (date-only) occurrence. When true, the occurrence
            is anchored to local midnight in its timezone. This marker does not
            change the wire encoding: start_time and end_time are always RFC3339
            date-times in the admin occurrence API (both request and response).
            Sending all_day: true anchors start_time and end_time to local midnight,
            in the occurrence's timezone, of the civil date each value carries (the
            leading date of the RFC3339 value, in the value's own offset). That is
            the same date rule ingestion applies to startDate, so the same value
            anchors to the same date through either entry point; a value that is
            midnight in a zone east of the occurrence's keeps the date it carries
            rather than moving a day earlier. A start_time the request does not
            supply is taken from the stored row, whose date is read in the row's
            current timezone (before any timezone change in the same request). Retiming an all-day occurrence to a time off
            local midnight — on either start_time or end_time — clears the marker,
            so a stored row can never claim is_all_day while holding a timed
            instant. Clearing the end with end_time: null does not clear the
            marker: a date-only occurrence may have no end.
        venue_ulid:
          type: [string, 'null']
          description: ULID of the venue for this occurrence, or null to clear
        virtual_url:
          type: [string, 'null']
          format: uri
          description: URL for virtual/hybrid attendance, or null to clear
        ticket_url:
          type: [string, 'null']
          format: uri
          description: URL for purchasing tickets, or null to clear
        price_min:
          type: [number, 'null']
          description: Minimum ticket price (inclusive), or null to clear
        price_max:
          type: [number, 'null']
          description: Maximum ticket price, or null to clear
        price_currency:
          type: string
          description: ISO 4217 currency code (e.g. USD)
        availability:
          type: string
          enum: [available, sold_out, limited]
          description: Ticket availability status
        yearWasInferred:
          type: boolean
          description: |
            True when the occurrence date lacked an explicit year and the parser inferred it.

    OccurrenceResponse:
      type: object
      description: An event occurrence as returned by the admin occurrence API
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the occurrence
        start_time:
          type: string
          format: date-time
        end_time:
          type: [string, 'null']
          format: date-time
        door_time:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
        all_day:
          type: boolean
          description: True if the occurrence is an all-day (date-only) event
        venue_id:
          type: [string, 'null']
          description: Internal UUID of the venue
        venue_ulid:
          type: [string, 'null']
          description: Public ULID of the venue
        virtual_url:
          type: [string, 'null']
          format: uri
        ticket_url:
          type: [string, 'null']
          format: uri
        price_min:
          type: [number, 'null']
        price_max:
          type: [number, 'null']
        price_currency:
          type: [string, 'null']
        availability:
          type: [string, 'null']

    Submission:
      type: object
      description: A URL submission record
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
          description: Original submitted URL
        url_norm:
          type: string
          format: uri
          description: Normalised URL (trailing slash stripped, lowercased scheme/host)
        submitted_at:
          type: string
          format: date-time
        submitter_ip:
          type: string
          description: IP address of the submitter
        status:
          type: string
          enum: [pending_validation, pending, processed, rejected]
        rejection_reason:
          type: [string, 'null']
          description: Set when the batch validator rejects the URL
        notes:
          type: [string, 'null']
          description: Admin review notes
        validated_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp when the batch validator processed this submission

    SubmissionResult:
      type: object
      description: Per-URL result from the public submission endpoint
      properties:
        url:
          type: string
          format: uri
          description: The URL that was submitted
        status:
          type: string
          enum: [accepted, duplicate, rejected]
          description: |
            `accepted` — stored for validation; `duplicate` — already submitted
            recently; `rejected` — failed basic validation (invalid URL, etc.)
        message:
          type: string
          description: Human-readable explanation

    ScraperSourceSummary:
      type: object
      description: A scraper source with its latest run summary
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
          format: uri
        tier:
          type: integer
        schedule:
          type: string
        license:
          type: string
        enabled:
          type: boolean
        extraction_method:
          type: string
          description: >-
            Extraction pipeline for this source. Empty or "scraper" for
            default tier-based dispatch, "ics" for ICS feed extraction,
            "bibliocommons_rss" for BiblioCommons library events RSS feeds.
          enum: ["", "scraper", "ics", "bibliocommons_rss"]
        tls_fingerprint:
          type: string
          description: >-
            TLS fingerprint spoofing mode. "chrome_auto" mimics Chrome's TLS handshake
            to bypass WAF detection (Akamai, Cloudflare). ALPN is restricted to http/1.1
            only to avoid HTTP/2 protocol mismatches on Cloudflare-protected sites.
            Empty means disabled (default). Not used by Tier 2 (headless browser already
            uses real Chrome).
        last_run_status:
          type: string
        last_run_started_at:
          type: string
          format: date-time
        last_run_completed_at:
          type: string
          format: date-time
        last_run_events_found:
          type: integer
        last_run_events_new:
          type: integer
        last_run_events_dup:
          type: integer
        last_run_events_failed:
          type: integer
        last_run_error_message:
          type: string

    ScraperConfig:
      type: object
      description: Global scraper configuration settings
      properties:
        auto_scrape:
          type: boolean
          description: Whether automatic scheduled scraping is enabled
          default: true
        max_concurrent_sources:
          type: integer
          description: Maximum number of sources to scrape concurrently
          default: 3
        request_timeout_seconds:
          type: integer
          description: HTTP request timeout in seconds
          default: 30
        retry_max_attempts:
          type: integer
          description: Maximum retry attempts for failed requests
          default: 3
        max_batch_size:
          type: integer
          description: Maximum number of events to batch per source
          default: 100
        rate_limit_ms:
          type: integer
          description: Minimum delay between requests in milliseconds
          default: 0

    ScraperConfigPatch:
      type: object
      description: Partial scraper configuration for PATCH requests (all fields optional)
      properties:
        auto_scrape:
          type: boolean
        max_concurrent_sources:
          type: integer
          description: Must be greater than 0
        request_timeout_seconds:
          type: integer
          description: Must be greater than 0
        retry_max_attempts:
          type: integer
          description: Must be greater than 0
        max_batch_size:
          type: integer
          description: Must be greater than 0
        rate_limit_ms:
          type: integer
          description: Must be 0 or greater

    ScraperRunDetail:
      type: object
      description: A single scraper run record
      properties:
        id:
          type: integer
        source_name:
          type: string
        source_url:
          type: string
          format: uri
        tier:
          type: integer
        status:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        events_found:
          type: integer
        events_new:
          type: integer
        events_dup:
          type: integer
        events_failed:
          type: integer
        error_message:
          type: string
        event_failures:
          type: array
          description: Per-event ingest failure details from the run metadata
          items:
            $ref: '#/components/schemas/EventFailure'

    EventFailure:
      type: object
      description: An individual event ingest failure within a scraper run
      properties:
        index:
          type: integer
          description: Zero-based index of the event in the scrape batch that failed
        url:
          type: string
          format: uri
          description: Source URL of the event that failed to ingest
        message:
          type: string
          description: Error message describing why the event failed to ingest

    SourceDiagnostics:
      type: object
      description: Diagnostics for a single scraper source including latest run, last successful run, and recent history
      properties:
        source_name:
          type: string
        latest_run:
          oneOf:
            - $ref: '#/components/schemas/ScraperRunDetail'
            - type: 'null'
          description: The most recent run for this source (null if no runs exist)
        last_successful_run:
          oneOf:
            - $ref: '#/components/schemas/ScraperRunDetail'
            - type: 'null'
          description: The most recent completed run (included when latest_run failed, for comparison)
        recent_runs:
          type: array
          items:
            $ref: '#/components/schemas/ScraperRunDetail'
          description: Recent runs ordered newest first (limited by query param)

    AllDiagnostics:
      type: object
      description: Cross-source diagnostics with filtered recent runs
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScraperRunDetail'
        total:
          type: integer
          description: Total number of runs returned

    Event:
      type: object
      description: A cultural event in Schema.org Event format with SEL extensions for provenance and federation
      required: ['@id', '@type', name, startDate, location]
      properties:
        '@context':
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
          description: |
            JSON-LD context. May be a string URL, an array of URLs, or an embedded context object.
            Per JSON-LD specification, all three forms are valid.
        '@id':
          type: string
          format: uri
          description: Canonical URI for this event
        '@type':
          type: string
          enum: [Event, EventSeries]
        name:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
          description: Descriptive keyword tags
        eventStatus:
          type: string
          format: uri
        eventAttendanceMode:
          type: string
          format: uri
        startDate:
          type: string
          description: |
            Event start time. Timed events are rendered in the node's local civil time
            with a DST-correct RFC3339 numeric offset (configurable via DEFAULT_TIMEZONE,
            default America/Toronto). All-day events (allDay: true) are emitted as a
            date-only YYYY-MM-DD value instead.
        endDate:
          type: string
          description: |
            Event end time. Timed events are rendered in the node's local civil time
            with a DST-correct RFC3339 numeric offset (configurable via DEFAULT_TIMEZONE,
            default America/Toronto). All-day events (allDay: true) are emitted as a
            date-only YYYY-MM-DD value instead.
        doorTime:
          type: string
          format: date-time
          description: |
            Door time in the node's local civil time with a DST-correct RFC3339
            numeric offset (configurable via DEFAULT_TIMEZONE, default America/Toronto).
        allDay:
          type: boolean
          description: |
            True for an all-day / date-only event. When true, startDate and endDate are
            date-only YYYY-MM-DD values rather than date-times.
        timeZone:
          type: string
          description: |
            The node's IANA civil timezone (e.g. America/Toronto), advertised once per
            event detail response (configurable via DEFAULT_TIMEZONE, default America/Toronto).
            It scopes the top-level event startDate/endDate/doorTime. Each subEvent entry
            is instead rendered in its own occurrence's timezone and labelled with the
            matching `timezone` value (see subEvent).
        location:
          $ref: '#/components/schemas/Place'
        organizer:
          $ref: '#/components/schemas/Organization'
        image:
          type: string
          format: uri
        url:
          type: string
          format: uri
        inLanguage:
          type: array
          items:
            type: string
        isAccessibleForFree:
          type: boolean
        offers:
          $ref: '#/components/schemas/Offer'
        sameAs:
          type: array
          items:
            type: string
            format: uri
        'sel:originNode':
          type: string
          format: uri
        'sel:ingestedAt':
          type: string
          format: date-time
        'sel:confidence':
          type: number
          minimum: 0
          maximum: 1
        license:
          type: string
          format: uri
        eventSchedule:
          $ref: '#/components/schemas/Schedule'
          description: |
            Recurrence schedule for recurring events. Present only when the event
            belongs to a series with a canonical RRULE. Derived from the RRULE
            FREQ/INTERVAL/BYDAY/BYMONTHDAY parameters mapped to ISO 8601 durations
            and schema.org Schedule vocabulary.
        subEvent:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
          description: |
            Per-occurrence sub-events (EventSeries serialisation). Each entry is
            rendered in its own occurrence's IANA timezone and labelled with the
            matching `timezone` value, so the numeric offset in startDate/endDate
            (and doorTime) always agrees with the `timezone` label — even for a
            mixed-zone occurrence whose stored per-occurrence zone differs from the
            node zone. The top-level event startDate/endDate/doorTime and the list
            envelope `timeZone` instead use the node's civil timezone.

    Schedule:
      type: object
      description: |
        schema.org Schedule type representing recurrence metadata for recurring events.
        Derived from canonical RRULE data stored on the event series.
      properties:
        '@type':
          type: string
          enum: [Schedule]
        repeatFrequency:
          type: string
          description: |
            ISO 8601 duration for the recurrence frequency.
            Derived from RRULE FREQ and INTERVAL:
            DAILY → P1D (or P{N}D with INTERVAL=N),
            WEEKLY → P1W (or P{N}W with INTERVAL=N),
            MONTHLY → P1M (or P{N}M with INTERVAL=N),
            YEARLY → P1Y (or P{N}Y with INTERVAL=N).
            HOURLY/MINUTELY/SECONDLY are omitted with a warning log.
          example: P1W
        byDay:
          type: array
          items:
            type: string
            enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          description: |
            Days of the week from RRULE BYDAY, mapped from two-letter codes
            (MO→Monday, TU→Tuesday, etc.) to schema.org DayOfWeek full names.
          example: [Monday, Wednesday]
        byMonthDay:
          type: array
          items:
            type: integer
          description: |
            Days of the month from RRULE BYMONTHDAY. Negative values count
            backwards from month end (e.g. -1 is the last day).
          example: [15, -15]
        startDate:
          type: string
          format: date-time
          description: Start date of the recurrence series (from first occurrence).
        endDate:
          type: string
          format: date-time
          description: End date of the recurrence series (from last occurrence end time, if available).
        scheduleTimezone:
          type: string
          description: IANA timezone identifier (e.g. America/Toronto).

    EventInput:
      type: object
      description: Input schema for creating or updating an event. Minimal required fields with optional Schema.org properties
      required: [name, startDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Event name (configurable via VALIDATION_MAX_EVENT_NAME_LENGTH, default 500)
        description:
          type: string
          maxLength: 10000
        startDate:
          type: string
          description: |
            Event start time, as either an RFC3339 date-time or a bare YYYY-MM-DD date.
            A bare date (or allDay: true) marks the event as all-day and is stored as
            local midnight in the occurrence/default timezone. On output, timed events
            are rendered in the node's local civil time with a DST-correct RFC3339 offset
            (configurable via DEFAULT_TIMEZONE, default America/Toronto); all-day events
            are emitted as a date-only YYYY-MM-DD value.
        endDate:
          type: string
          description: |
            Event end time, as either an RFC3339 date-time or a bare YYYY-MM-DD date
            (see startDate). All-day events are emitted as a date-only YYYY-MM-DD value.
        doorTime:
          type: string
          format: date-time
        allDay:
          type: boolean
          description: |
            Marks the event as all-day / date-only. When true, startDate and endDate are
            treated (and emitted) as date-only YYYY-MM-DD values. Also set automatically
            when startDate is a bare YYYY-MM-DD date.

            This is a statement about the event's OWN dates, which mirror the first
            occurrence. It is not copied onto the other occurrences of a series: each
            occurrence row carries its own all_day/marker and is anchored in its own
            timezone (see the occurrence-level all_day). Review fixes address the
            event's own dates and therefore correct only the occurrence they mirror.
        location:
          oneOf:
            - $ref: '#/components/schemas/PlaceInput'
            - $ref: '#/components/schemas/VirtualLocationInput'
        virtualLocation:
          $ref: '#/components/schemas/VirtualLocationInput'
        organizer:
          $ref: '#/components/schemas/OrganizationInput'
        image:
          type: string
          format: uri
        url:
          type: string
          format: uri
        keywords:
          type: array
          items:
            type: string
        inLanguage:
          type: array
          items:
            type: string
        isAccessibleForFree:
          type: boolean
        offers:
          $ref: '#/components/schemas/OfferInput'
        source:
          $ref: '#/components/schemas/SourceInput'
        yearWasInferred:
          type: boolean
          description: |
            True when the source date lacked an explicit year and the parser inferred it.
            When true, events beyond VALIDATION_AMBIGUOUS_DATE_MAX_FUTURE_DAYS (default 60)
            are sent to the review queue with an ambiguous_year_far_future warning.
        recurrence:
          $ref: '#/components/schemas/RecurrenceInput'
          description: |
            Series recurrence metadata for ICS-ingested recurring events.
            When present, the create pipeline upserts an event_series row using
            external_key as the upsert key, and links this event to the series.

    RecurrenceInput:
      type: object
      description: |
        Carries series-level recurrence metadata populated by the ICS mapper.
        All occurrences from the same master VEVENT share an identical RecurrenceInput.
        The createEventCore pipeline uses it to upsert exactly one event_series row
        per master UID (keyed by external_key).
      required: [external_key, series_name, series_start, rrule, tzid]
      properties:
        external_key:
          type: string
          description: Upsert key for the event_series row, formatted as "<source_name>:<master_uid>".
        series_name:
          type: string
          description: Master VEVENT SUMMARY (shared across all occurrences).
        series_start:
          type: string
          format: date-time
          description: DTSTART truncated to local date (TZID-aware).
        series_end:
          type: ['string', 'null']
          format: date-time
          description: UNTIL date if present in RRULE; null for COUNT-only or infinite rules.
        rrule:
          type: string
          description: RFC 5545 RRULE value string (no "RRULE:" prefix).
        exdates:
          type: array
          items:
            type: string
            format: date-time
          description: EXDATE UTC timestamps from the master VEVENT.
        rdates:
          type: array
          items:
            type: string
            format: date-time
          description: RDATE UTC timestamps from the master VEVENT.
        tzid:
          type: string
          description: IANA timezone ID from DTSTART's TZID parameter.

    EventUpdateInput:
      description: Schema for updating an existing event with version control for optimistic locking
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            version:
              type: integer
              description: Current version for optimistic locking
            lifecycleState:
              type: string
              enum: [draft, published, postponed, rescheduled, sold_out, cancelled, completed]

    Place:
      description: A physical location or venue where events occur, using Schema.org Place vocabulary
      type: object
      required: ['@type', name]
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          enum: [Place]
        name:
          type: string
        address:
          $ref: '#/components/schemas/PostalAddress'
        geo:
          $ref: '#/components/schemas/GeoCoordinates'
        telephone:
          type: string
        url:
          type: string
          format: uri
        sameAs:
          type: array
          items:
            type: string
            format: uri

    PlaceInput:
      description: Input schema for specifying event locations with address and geographic coordinates
      type: object
      required: [name]
      properties:
        '@id':
          type: string
          format: uri
          description: Reference to existing place by URI
        name:
          type: string
        streetAddress:
          type: string
        addressLocality:
          type: string
        addressRegion:
          type: string
        postalCode:
          type: string
        addressCountry:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    VirtualLocationInput:
      description: Input schema for online/virtual event locations with URL
      type: object
      required: [url]
      properties:
        '@type':
          type: string
          enum: [VirtualLocation]
        url:
          type: string
          format: uri
        name:
          type: string

    PostalAddress:
      description: Physical mailing address using Schema.org PostalAddress vocabulary
      type: object
      properties:
        '@type':
          type: string
          enum: [PostalAddress]
        streetAddress:
          type: string
        addressLocality:
          type: string
        addressRegion:
          type: string
        postalCode:
          type: string
        addressCountry:
          type: string

    GeoCoordinates:
      description: Geographic coordinates (latitude/longitude) using Schema.org GeoCoordinates vocabulary
      type: object
      properties:
        '@type':
          type: string
          enum: [GeoCoordinates]
        latitude:
          type: number
        longitude:
          type: number

    Organization:
      description: An organization or person that organizes events, using Schema.org Organization vocabulary
      type: object
      required: ['@type', name]
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          enum: [Organization]
        name:
          type: string
        alternateName:
          type: string
        url:
          type: string
          format: uri
        sameAs:
          type: array
          items:
            type: string
            format: uri

    OrganizationInput:
      description: Input schema for specifying event organizers
      type: object
      required: [name]
      properties:
        '@id':
          type: string
          format: uri
        name:
          type: string
        url:
          type: string
          format: uri

    Offer:
      description: Ticketing or pricing information using Schema.org Offer vocabulary
      type: object
      properties:
        '@type':
          type: string
          enum: [Offer]
        url:
          type: string
          format: uri
        price:
          type: string
        priceCurrency:
          type: string
        availability:
          type: string
          format: uri

    OfferInput:
      description: Input schema for ticket/pricing offers
      type: object
      properties:
        url:
          type: string
          format: uri
        price:
          type: string
        priceCurrency:
          type: string
          default: CAD

    SourceInput:
      description: Provenance metadata identifying the data source and attribution for submitted events
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Source URL for provenance
        eventId:
          type: string
          description: External system's event ID

    EventSummary:
      type: object
      description: Compact event representation returned in list responses. For the full record (organizer, offers, provenance) fetch the individual event by @id.
      required: ['@id', '@type', name, startDate, location]
      properties:
        '@context':
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
          description: >
            JSON-LD context. Present on every item in the default `?context=item`
            list mode. Omitted per-item when `?context=document` is used — the
            single document-level `@context` on the response then scopes the item.
        '@id':
          type: string
          format: uri
          description: Canonical URI for this event
        '@type':
          type: string
          enum: [Event, EventSeries]
        name:
          type: string
        description:
          type: string
          description: Event description. Present when the source provided one.
        keywords:
          type: array
          items:
            type: string
          description: Descriptive keyword tags. Present when the source provided them.
        startDate:
          type: string
          description: |
            Event start time. For list items, timed events are rendered in the node's
            local civil time with a DST-correct RFC3339 numeric offset (configurable
            via DEFAULT_TIMEZONE, default America/Toronto). When this schema is used
            for a `subEvent` entry (see Event.subEvent), the value is instead rendered
            in that occurrence's own IANA zone and matches the `timezone` label below.
            All-day events (allDay: true) are emitted as a date-only YYYY-MM-DD value.
        endDate:
          type: string
          description: |
            Event end time. For list items, timed events are rendered in the node's
            local civil time with a DST-correct RFC3339 numeric offset (configurable
            via DEFAULT_TIMEZONE, default America/Toronto). When this schema is used
            for a `subEvent` entry (see Event.subEvent), the value is instead rendered
            in that occurrence's own IANA zone and matches the `timezone` label below.
            All-day events (allDay: true) are emitted as a date-only YYYY-MM-DD value.
        allDay:
          type: boolean
          description: |
            True for an all-day / date-only event. When true, startDate and endDate are
            date-only YYYY-MM-DD values rather than date-times.
        timezone:
          type: string
          description: |
            IANA timezone identifier for this entry. Present on `subEvent` entries,
            where it always matches the numeric offset in startDate/endDate/doorTime
            (each occurrence is rendered in its own zone and labelled accordingly).
        doorTime:
          type: string
          format: date-time
          description: |
            Doors-open time. Present on `subEvent` entries, rendered in the same
            occurrence zone as startDate (see timezone).
        location:
          $ref: '#/components/schemas/Place'
        eventSchedule:
          $ref: '#/components/schemas/Schedule'

    EventListResponse:
      description: Paginated list of events with cursor-based pagination
      type: object
      required: [items]
      properties:
        '@context':
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
          description: >
            Document-level JSON-LD context emitted only by the public
            `GET /api/v1/events` list endpoint when `?context=document` is
            requested. Scopes every member of `items`; per-item `@context`
            blocks are omitted in that mode. Absent otherwise (default `item`
            mode and other endpoints that reuse this schema, which never emit a
            document-level context).
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        next_cursor:
          type: string
          description: Cursor for next page
        timeZone:
          type: string
          description: |
            The node's IANA civil timezone (e.g. America/Toronto), advertised once per
            result set (configurable via DEFAULT_TIMEZONE, default America/Toronto).
        warnings:
          type: array
          items:
            type: string
          description: >
            Parameter warnings. Present when a snake_case alias (e.g. start_date) was used
            instead of the canonical camelCase name, OR when an unrecognised query parameter
            was supplied and ignored (e.g. a guessed proximity param like lat/lng/radius_km).
            Each entry names the offending parameter. Omitted when nothing was detected.
            Unrecognised parameters are never rejected — the list is returned unfiltered by
            them — so check warnings to avoid trusting results that were not filtered as intended.

    PlaceListResponse:
      description: Paginated list of places (venues) with cursor-based pagination
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        next_cursor:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: Parameter alias warnings. See EventListResponse.warnings for details.

    OrganizationListResponse:
      description: Paginated list of organizations with cursor-based pagination
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: Parameter alias warnings. See EventListResponse.warnings for details.

    ChangeFeedResponse:
      description: Federation change feed containing sequential updates for event synchronization
      type: object
      required: [cursor, changes]
      properties:
        cursor:
          type: string
          description: Current cursor position
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'
        next_cursor:
          type: string
          description: Cursor for next page

    ChangeEntry:
      description: Single change record in the federation feed with action type and snapshot
      type: object
      required: [action, uri, changed_at]
      properties:
        action:
          type: string
          enum: [create, update, delete]
        uri:
          type: string
          format: uri
        changed_at:
          type: string
          format: date-time
        changed_fields:
          type: array
          items:
            type: string
        snapshot:
          $ref: '#/components/schemas/Event'

    ApiKeyInfo:
      description: API key metadata (without secret), as returned by GET /api/v1/admin/api-keys.
      type: object
      properties:
        id:
          type: string
          format: uuid
        prefix:
          type: string
          description: First 8 chars of the key.
        name:
          type: string
        source_id:
          type: [string, 'null']
          format: uuid
          description: Source this key is associated with, if any.
        role:
          type: string
        rate_limit_tier:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        federation_node_id:
          type: [string, 'null']
          format: uuid
          description: |
            Federation node this key is bound to, or `null` for an unbound key.
            Unbound keys are rejected by `POST /api/v1/federation/sync`.

    ApiKeyCreated:
      description: Response when creating a new API key, includes the secret (shown only once).
      type: object
      required: [api_key, prefix, name, role, warning]
      properties:
        api_key:
          type: string
          description: Full API key (shown only once).
        prefix:
          type: string
          description: First 8 chars of the key.
        name:
          type: string
        role:
          type: string
        expires_at:
          type: [string, 'null']
          format: date-time
        federation_node_id:
          type: [string, 'null']
          format: uuid
          description: |
            Canonical UUID of the federation node the key was bound to, or
            `null`/absent for an unbound key.
        warning:
          type: string
          description: Security warning instructing the caller to save the key now.

    ReviewQueueListResponse:
      description: Paginated list of events awaiting admin review
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        next_cursor:
          type: string
          description: Cursor for next page (review queue entry ID)

    ReviewQueueItem:
      description: Summary of a review queue entry with event ID and reason for review
      type: object
      required: [id, eventId, warnings, status, createdAt]
      properties:
        id:
          type: integer
          description: Review queue entry ID
        eventId:
          type: string
          description: Event ULID
        sourceId:
          type: [string, 'null']
          description: Source identifier for provenance tracking.
        eventName:
          type: string
          description: Name of the event (from original payload)
        eventStartTime:
          type: string
          format: date-time
          description: Event start time
        eventEndTime:
          type: string
          format: date-time
          description: Event end time
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'
          description: Validation warnings that triggered review
        status:
          type: string
          enum: [pending, approved, rejected, merged, dismissed]
          description: >
            Current review status. `pending` = awaiting decision; `approved` = event published;
            `rejected` = event deleted; `merged` = event absorbed into another event
            (via add-occurrence or consolidation); `dismissed` = companion review resolved
            via consolidation.
        createdAt:
          type: string
          format: date-time
          description: When the entry was created
        reviewedBy:
          type: string
          description: Email of admin who reviewed (if reviewed)
        reviewedAt:
          type: string
          format: date-time
          description: When the review was completed (if reviewed)
        duplicateOfEventUlid:
          type: string
          description: >
            ULID of the primary event that this review entry was merged into or linked as a
            near-duplicate of. Set when the review action is add-occurrence or consolidation,
            and also when near-duplicate cross-linking creates a review entry for an existing
            published event.

        occurrenceCount:
          type: integer
          description: >
            Number of occurrences for the event. Fetched from the live event data
            to reflect current occurrence information.

    ReviewQueueDetail:
      description: Detailed review queue entry including original payload, normalized payload, and detected changes
      type: object
      required: [id, eventId, status, warnings, original, normalized, changes, createdAt, occurrences, relatedEvents]
      properties:
        id:
          type: integer
          description: Review queue entry ID
        eventId:
          type: string
          description: Event ULID
        sourceId:
          type: [string, 'null']
          description: Source identifier for provenance tracking.
        status:
          type: string
          enum: [pending, approved, rejected, merged, dismissed]
          description: >
            Current review status. `pending` = awaiting decision; `approved` = event published;
            `rejected` = event deleted; `merged` = event absorbed into another event
            (via add-occurrence or consolidation); `dismissed` = companion review resolved
            via consolidation.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'
          description: Validation warnings that triggered review
        original:
          type: object
          description: Original event payload as submitted
        normalized:
          type: object
          description: Normalized event payload after corrections
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeDetail'
          description: List of changes made during normalization
        createdAt:
          type: string
          format: date-time
          description: When the entry was created
        reviewedBy:
          type: string
          description: Email of admin who reviewed (if reviewed)
        reviewedAt:
          type: string
          format: date-time
          description: When the review was completed (if reviewed)
        reviewNotes:
          type: string
          description: Notes from the reviewer (if approved with notes)
        rejectionReason:
          type: string
          description: Reason for rejection (if rejected)
        duplicateOfEventUlid:
          type: string
          description: >
            ULID of the primary event that this review entry was merged into or linked as a
            near-duplicate of. Set when the review action is add-occurrence or consolidation,
            and also when near-duplicate cross-linking creates a review entry for an existing
            published event.
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/EventOccurrence'
          description: List of occurrences for the event associated with this review entry
        relatedEvents:
          type: array
          items:
            $ref: '#/components/schemas/RelatedEvent'
          description: Related events identified from warnings or duplicate link

    EventOccurrence:
      description: A single occurrence (date/time/venue) of an event
      type: object
      required: [id, startTime, timezone]
      properties:
        id:
          type: string
          description: Occurrence UUID
        startTime:
          type: string
          format: date-time
          description: Start date and time of the occurrence
        endTime:
          type: [string, 'null']
          format: date-time
          description: End date and time of the occurrence (optional)
        timezone:
          type: string
          description: IANA timezone identifier (e.g., America/New_York)
        doorTime:
          type: [string, 'null']
          format: date-time
          description: Doors open time (optional)
        venueUlid:
          type: [string, 'null']
          description: ULID of the venue (optional)
        virtualUrl:
          type: [string, 'null']
          description: Virtual event URL (optional)
        ticketUrl:
          type: string
          description: URL to purchase tickets (optional)
        priceMin:
          type: [number, 'null']
          format: float
          description: Minimum ticket price (optional)
        priceMax:
          type: [number, 'null']
          format: float
          description: Maximum ticket price (optional)
        priceCurrency:
          type: string
          description: ISO 4217 currency code (e.g., USD)
        availability:
          type: string
          description: Availability status (e.g., InStock, OutOfStock)

    RelatedEvent:
      description: A related event identified from warnings or duplicate link, including full event data for side-by-side comparison
      type: object
      required: [ulid]
      properties:
        ulid:
          type: string
          description: ULID of the related event
        name:
          type: string
          description: Event name
        description:
          type: [string, 'null']
          description: Event description (optional)
        url:
          type: [string, 'null']
          description: Public URL of the event (optional)
        imageUrl:
          type: [string, 'null']
          description: Image URL for the event (optional)
        venueName:
          type: [string, 'null']
          description: Name of the primary venue (optional)
        venueUlid:
          type: [string, 'null']
          description: ULID of the primary venue (optional)
        venueStreetAddress:
          type: [string, 'null']
          description: Street address of the venue (optional)
        venueCity:
          type: [string, 'null']
          description: City of the venue (optional)
        venueRegion:
          type: [string, 'null']
          description: Province/region of the venue (optional)
        venuePostalCode:
          type: [string, 'null']
          description: Postal code of the venue (optional)
        organizerName:
          type: [string, 'null']
          description: Name of the organizer (optional)
        organizerUrl:
          type: [string, 'null']
          description: URL of the organizer (optional)
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/EventOccurrence'
          description: List of occurrences for the related event
        similarity:
          type: [number, 'null']
          format: float
          description: Similarity score from duplicate-warning details, if available (0–1)

    ValidationWarning:
      description: Warning message from event validation or normalization process
      type: object
      required: [code, message]
      properties:
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/EventOccurrence'
          description: >
            List of occurrences for the event under review. These are fetched from the
            live event data (not from the ingest snapshot) to ensure the UI shows current
            occurrence information for dedup decision-making. Empty if the event has no
            occurrences (e.g., single-instance long-duration occurrence).
        relatedEvents:
          type: array
          items:
            $ref: '#/components/schemas/RelatedEvent'
          description: >
            List of related events extracted from validation warnings (potential_duplicate,
            near_duplicate_of_new_event) and from the duplicateOfEventUlid field. Each entry
            includes full event data (name, description, URL, venue, occurrences, similarity)
            so the UI can render the side-by-side comparison panel without additional API calls.
            Used to determine which case applies (Case 1: empty list, Case 2/3: non-empty list).
        code:
          type: string
          description: Warning code (e.g., "REVERSED_DATES", "MISSING_END_DATE")
        message:
          type: string
          description: Human-readable warning message
        field:
          type: string
          description: Field path that triggered the warning
        severity:
          type: string
          enum: [info, warning, error]
          description: Warning severity level

    ChangeDetail:
      description: Record of a single field change made during event normalization
      type: object
      required: [field, original, corrected, reason]
      properties:
        field:
          type: string
          description: Field that was changed (e.g., "endDate")
        original:
          description: Original value before normalization (can be any type)
          example: "2026-03-15T22:00:00Z"
          anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
            - type: array
            - type: "null"
        corrected:
          description: Corrected value after normalization (can be any type)
          example: "2026-03-16T22:00:00Z"
          anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
            - type: array
            - type: "null"
        reason:
          type: string
          description: Explanation of why the change was made

    AdminUserResponse:
      type: object
      required: [id, username, email, role, is_active, status, created_at]
      description: Admin user representation returned by user management endpoints.
      properties:
        id:
          type: string
          format: uuid
          description: User's unique identifier
        username:
          type: string
          description: User's login username
        email:
          type: string
          format: email
          description: User's email address
        role:
          type: string
          enum: [admin, editor, viewer]
          description: User's role
        is_active:
          type: boolean
          description: Whether the user account is active
        status:
          type: string
          enum: [active, inactive, pending]
          description: "Derived user status. active: account is active; pending: account created but invitation not yet accepted (no password set); inactive: account was active but has been deactivated"
        created_at:
          type: string
          format: date-time
          description: When the user account was created
        last_login_at:
          type: [string, "null"]
          format: date-time
          description: When the user last logged in, or null if never

    ProblemDetails:
      type: object
      required: [type, title, status]
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
          example: https://sel.events/problems/max-keys-exceeded
        title:
          type: string
          description: Short, human-readable summary
          example: Maximum API keys exceeded
        status:
          type: integer
          description: HTTP status code
          example: 409
        detail:
          type: string
          description: Human-readable explanation
          example: You have reached your maximum of 5 API keys. Revoke an existing key or contact an admin to increase your limit.
        instance:
          type: string
          description: URI identifying the specific occurrence
          example: /api/v1/dev/api-keys

    Developer:
      type: object
      description: Developer account with API key management capabilities
      required: [id, email, name, max_keys, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Developer UUID
        email:
          type: string
          format: email
          description: Developer's email address
        name:
          type: string
          description: Developer's full name
        github_username:
          type: string
          description: GitHub username if linked via OAuth
        max_keys:
          type: integer
          minimum: 1
          maximum: 20
          description: Maximum API keys this developer can create
        is_active:
          type: boolean
          description: Whether the developer account is active
        created_at:
          type: string
          format: date-time
          description: When the developer account was created
        last_login_at:
          type: string
          format: date-time
          description: When the developer last logged in

    DeveloperAPIKey:
      type: object
      description: Developer-owned API key with usage statistics (secret not included)
      required: [id, name, prefix, role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: API key UUID
        name:
          type: string
          description: Human-readable name for the key
        prefix:
          type: string
          description: First 8 characters of the key for identification
          example: 01KGJZ40
        role:
          type: string
          enum: [agent]
          description: API key role (always 'agent' for developer keys)
        is_active:
          type: boolean
          description: Whether the key is currently active
        created_at:
          type: string
          format: date-time
          description: When the key was created
        last_used_at:
          type: string
          format: date-time
          description: When the key was last used
        usage_today:
          type: integer
          description: Number of requests made today
          example: 1523
        usage_7d:
          type: integer
          description: Number of requests in the last 7 days
          example: 8420
        usage_30d:
          type: integer
          description: Number of requests in the last 30 days
          example: 34210

    DeveloperAPIKeyCreated:
      type: object
      description: Response when creating a new API key, includes full secret (shown only once)
      required: [id, name, prefix, key, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          example: 01KGJZ40
        key:
          type: string
          description: Full API key secret (shown only once on creation)
          example: 01KGJZ40ZG0WQ5SQ...
        role:
          type: string
          enum: [agent]
        created_at:
          type: string
          format: date-time

    APIKeyUsage:
      type: object
      description: Detailed usage statistics for an API key over a date range
      required: [api_key_id, api_key_name, period, total_requests, total_errors, daily]
      properties:
        api_key_id:
          type: string
          format: uuid
          description: API key UUID
        api_key_name:
          type: string
          description: API key name
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date
              description: Start date of usage period
            to:
              type: string
              format: date
              description: End date of usage period
        total_requests:
          type: integer
          description: Total number of requests in the period
          example: 34210
        total_errors:
          type: integer
          description: Total number of errors (4xx/5xx) in the period
          example: 142
        daily:
          type: array
          description: Daily breakdown of usage statistics
          items:
            type: object
            required: [date, request_count, error_count]
            properties:
              date:
                type: string
                format: date
              request_count:
                type: integer
                example: 1523
              error_count:
                type: integer
                example: 3

    Tombstone:
      type: object
      description: Response for deleted entities (HTTP 410)
      properties:
        '@context':
          type: [string, object]
        '@type':
          type: string
        '@id':
          type: string
          format: uri
        eventStatus:
          type: string
          format: uri
        'sel:tombstone':
          type: boolean
        'sel:deletedAt':
          type: string
          format: date-time
        'sel:deletionReason':
          type: string
        'sel:supersededBy':
          type: string
          format: uri

    IdentityRef:
      type: object
      description: Reference to a SEL entity by type and ULID
      required: [entity_type, entity_id]
      properties:
        entity_type:
          type: string
          enum: [place, organization]
        entity_id:
          type: string
          description: Entity ULID

    IdentifierView:
      type: object
      description: A single external identifier observation
      properties:
        authority:
          type: string
        uri:
          type: string
        method:
          type: string
        confidence:
          type: number
        is_primary:
          type: boolean
        source:
          type: string
        observed_at:
          type: string
          format: date-time

    DecisionRecord:
      type: object
      description: One identity_decisions ledger row
      required: [id, created_at, entity_type, entity_id, action, rationale, citations, confidence, actor, reversible]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        entity_type:
          type: string
          enum: [place, organization]
        entity_id:
          type: string
        action:
          type: string
          enum: [link, reject]
        counterpart_type:
          type: string
          enum: [place, organization]
        counterpart_id:
          type: string
        rationale:
          type: string
        citations:
          type: array
          items:
            type: string
        confidence:
          type: number
        actor:
          type: string
        reversible:
          type: boolean
        undo_ref:
          type: string
        metadata:
          type: object
          additionalProperties: true

    IdentityView:
      type: object
      description: An entity's identity state (identifiers, primaries, decisions)
      properties:
        ref:
          $ref: '#/components/schemas/IdentityRef'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierView'
        primary:
          type: object
          additionalProperties:
            type: string
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DecisionRecord'

    ConflictItem:
      type: object
      description: One unordered pair of entities sharing an identifier
      properties:
        ref:
          $ref: '#/components/schemas/IdentityRef'
        candidate:
          $ref: '#/components/schemas/IdentityRef'
        authority:
          type: string
        uri:
          type: string
        score:
          type: number
        suppressed:
          type: boolean
        prior_decision:
          $ref: '#/components/schemas/DecisionRecord'

    ConflictsResponse:
      type: object
      description: Paginated identity conflicts feed
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        next_cursor:
          type: [string, 'null']

    DecisionsResponse:
      type: object
      description: Paginated identity decisions feed
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DecisionRecord'
        next_cursor:
          type: [string, 'null']

    IdentityLinkRequest:
      type: object
      description: Request body for recording an identifier link decision
      required: [entity_type, entity_id, authority, uri]
      properties:
        entity_type:
          type: string
          enum: [place, organization]
        entity_id:
          type: string
          description: Entity ULID
        authority:
          type: string
        uri:
          type: string
        method:
          type: string
          description: Restricted to `manual` in Phase 1 (anything else is normalised to manual)
        confidence:
          type: number
          description: Clamped to [0,1] (default 1.0)
        source:
          type: string
          description: Restricted to `manual` in Phase 1 (anything else is normalised to manual)
        rationale:
          type: string

    IdentityRejectRequest:
      type: object
      description: Request body for recording a reject decision
      required: [entity_type, entity_id, counterpart_id]
      properties:
        entity_type:
          type: string
          enum: [place, organization]
        entity_id:
          type: string
          description: Entity ULID
        counterpart_id:
          type: string
          description: Counterpart entity ULID
        reason:
          type: string

    StatsResponse:
      type: object
      description: Public server statistics returned by `GET /api/v1/stats`.
      required: [status, version, git_commit, uptime_seconds, total_events, total_places, total_organizations, total_sources, total_users, published_events, pending_events, events_created_last_7_days, events_created_last_30_days, upcoming_events, past_events, timestamp]
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
        git_commit:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        slot:
          type: string
          description: Deployment slot (blue/green), when configured.
        total_events:
          type: integer
          format: int64
        total_places:
          type: integer
          format: int64
        total_organizations:
          type: integer
          format: int64
        total_sources:
          type: integer
          format: int64
        total_users:
          type: integer
          format: int64
        published_events:
          type: integer
          format: int64
        pending_events:
          type: integer
          format: int64
          description: Events currently in the `draft` lifecycle state.
        events_created_last_7_days:
          type: integer
          format: int64
        events_created_last_30_days:
          type: integer
          format: int64
        upcoming_events:
          type: integer
          format: int64
        past_events:
          type: integer
          format: int64
        oldest_event_date:
          type: string
          format: date-time
        newest_event_date:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time

    GeocodeResponse:
      type: object
      required: [latitude, longitude, display_name, source, cached, attribution]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        display_name:
          type: string
        source:
          type: string
          enum: [cache, nominatim]
        cached:
          type: boolean
        attribution:
          type: string
          example: Data © OpenStreetMap contributors, ODbL 1.0

    ReverseGeocodeResponse:
      type: object
      required: [display_name, address, latitude, longitude, source, cached, attribution]
      properties:
        display_name:
          type: string
        address:
          $ref: '#/components/schemas/AddressComponents'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        source:
          type: string
          enum: [cache, nominatim]
        cached:
          type: boolean
        attribution:
          type: string

    AddressComponents:
      type: object
      properties:
        road:
          type: string
        suburb:
          type: string
        city:
          type: string
        state:
          type: string
        postcode:
          type: string

    AcceptInvitationResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          type: object
          required: [id, username, email, role]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, editor, viewer]

    FederationSyncResponse:
      type: object
      required: ['@type', '@id', localId, federationUri]
      properties:
        '@context':
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
        '@type':
          type: string
          enum: [Event]
        '@id':
          type: string
          format: uri
        localId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        federationUri:
          type: string
          format: uri

    HealthCheck:
      type: object
      required: [status, version, git_commit, checks, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, shutting_down]
        version:
          type: string
        git_commit:
          type: string
        slot:
          type: string
        docs_url:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheckResult'
        timestamp:
          type: string
          format: date-time

    HealthCheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pass, warn, fail]
        message:
          type: string
        latency_ms:
          type: integer
          format: int64
        details:
          type: object
          additionalProperties: true

    VersionResponse:
      type: object
      required: [version, git_commit, build_date, go_version]
      properties:
        version:
          type: string
        git_commit:
          type: string
        build_date:
          type: string
        go_version:
          type: string

    AdminEventSummary:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            description:
              type: string
            confidence:
              type: [number, 'null']
              format: double
            lifecycle_state:
              type: string
            start_date:
              type: string
              format: date-time
            all_day:
              type: boolean

    AdminEventListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminEventSummary'
        next_cursor:
          type: string

    AdminEventResponse:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            lifecycle_state:
              type: string
              enum: [draft, published, postponed, rescheduled, sold_out, cancelled, completed]

    AdminPlaceResponse:
      type: object
      required: [ulid, name, created_at, updated_at]
      properties:
        ulid:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        name:
          type: string
        description:
          type: string
        street_address:
          type: string
        city:
          type: string
        region:
          type: string
        postal_code:
          type: string
        country:
          type: string
        latitude:
          type: [number, 'null']
          format: double
        longitude:
          type: [number, 'null']
          format: double
        telephone:
          type: string
        email:
          type: string
          format: email
        url:
          type: string
          format: uri
        lifecycle:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminPlaceUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        street_address:
          type: string
        city:
          type: string
        region:
          type: string
        postal_code:
          type: string
        country:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        telephone:
          type: string
        email:
          type: string
          format: email
        url:
          type: string
          format: uri

    AdminOrganizationResponse:
      type: object
      required: [ulid, name, created_at, updated_at]
      properties:
        ulid:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        name:
          type: string
        description:
          type: string
        street_address:
          type: string
        address_locality:
          type: string
        address_region:
          type: string
        postal_code:
          type: string
        address_country:
          type: string
        telephone:
          type: string
        email:
          type: string
          format: email
        url:
          type: string
          format: uri
        lifecycle:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminOrganizationUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        street_address:
          type: string
        address_locality:
          type: string
        address_region:
          type: string
        postal_code:
          type: string
        address_country:
          type: string
        telephone:
          type: string
        email:
          type: string
          format: email
        url:
          type: string
          format: uri

    SimilarityCandidate:
      type: object
      required: [ulid, name, similarity]
      properties:
        ulid:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        name:
          type: string
        similarity:
          type: number
          format: double
          minimum: 0
          maximum: 1

    MergeRequest:
      type: object
      required: [primary_id, duplicate_id]
      properties:
        primary_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        duplicate_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    MergeResult:
      type: object
      required: [status, canonical_id, already_merged]
      properties:
        status:
          type: string
          enum: [merged]
        canonical_id:
          type: string
        already_merged:
          type: boolean

    BackfillResponse:
      type: object
      required: [places_enqueued, events_enqueued, estimated_duration]
      properties:
        places_enqueued:
          type: integer
        events_enqueued:
          type: integer
        estimated_duration:
          type: string

    AdminUserListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserResponse'
        next_cursor:
          type: [string, 'null']
        total:
          type: integer
          format: int64

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    FederationNode:
      type: object
      description: |
        Federation node record. Field names are the Go field names because the
        underlying struct has no JSON tags.
      properties:
        ID:
          type: string
          format: uuid
        NodeDomain:
          type: string
        NodeName:
          type: string
        BaseURL:
          type: string
          format: uri
        APIVersion:
          type: string
        GeographicScope:
          type: [string, 'null']
        TrustLevel:
          type: integer
          minimum: 1
          maximum: 10
        FederationStatus:
          type: string
          enum: [pending, active, paused, blocked]
        SyncEnabled:
          type: boolean
        SyncDirection:
          type: string
          enum: [bidirectional, pull_only, push_only, disabled]
        LastSyncAt:
          type: [string, 'null']
          format: date-time
        LastSuccessfulSyncAt:
          type: [string, 'null']
          format: date-time
        SyncCursor:
          type: [string, 'null']
        RequiresAuth:
          type: boolean
        ContactEmail:
          type: [string, 'null']
          format: email
        ContactName:
          type: [string, 'null']
        IsOnline:
          type: boolean
        LastHealthCheckAt:
          type: [string, 'null']
          format: date-time
        LastErrorAt:
          type: [string, 'null']
          format: date-time
        LastErrorMessage:
          type: [string, 'null']
        Notes:
          type: [string, 'null']
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time

    FederationNodeInput:
      type: object
      required: [NodeDomain, NodeName, BaseURL, TrustLevel, FederationStatus, SyncDirection]
      properties:
        NodeDomain:
          type: string
          description: Unique node domain, e.g. `toronto.togather.foundation`.
        NodeName:
          type: string
        BaseURL:
          type: string
          format: uri
        APIVersion:
          type: string
        GeographicScope:
          type: string
        TrustLevel:
          type: integer
          minimum: 1
          maximum: 10
        FederationStatus:
          type: string
          enum: [pending, active, paused, blocked]
        SyncEnabled:
          type: boolean
        SyncDirection:
          type: string
          enum: [bidirectional, pull_only, push_only, disabled]
        ContactEmail:
          type: string
          format: email
        ContactName:
          type: string
        Notes:
          type: string

    FederationNodeUpdate:
      type: object
      properties:
        NodeName:
          type: string
        BaseURL:
          type: string
          format: uri
        APIVersion:
          type: string
        GeographicScope:
          type: string
        TrustLevel:
          type: integer
          minimum: 1
          maximum: 10
        FederationStatus:
          type: string
          enum: [pending, active, paused, blocked]
        SyncEnabled:
          type: boolean
        SyncDirection:
          type: string
          enum: [bidirectional, pull_only, push_only, disabled]
        ContactEmail:
          type: string
          format: email
        ContactName:
          type: string
        Notes:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Gone:
      description: Resource deleted
      content:
        application/ld+json:
          schema:
            $ref: '#/components/schemas/Tombstone'
