  /api/v1/federation/sync:
    post:
      operationId: syncFederatedEvent
      summary: Import or update a federated event
      description: |
        Accepts a JSON-LD Event from a trusted federation node and preserves its
        original URI as the canonical `@id`. Requires an API key. Supports
        idempotent retries via `Idempotency-Key`.

        **Node binding (fail closed).** The authenticated API key must be bound
        to a federation node (`api_keys.federation_node_id`, set at key creation
        with `federation_node_id`). Unbound keys are rejected with `403`. The
        bound node must match the host of the payload `@id`, be
        `federation_status: active`, have `sync_enabled` true (the column
        default; `NULL` is treated as true), and have `sync_direction`
        `bidirectional` or `pull_only` (`NULL` is treated as bidirectional).
        Events from `push_only`, `paused`, `blocked`, `pending`, or
        `sync_enabled: false` nodes are rejected with `403`.

        Nested `location` and `organizer` objects that carry an `@id` must also
        belong to the same node domain; a foreign nested `@id` is rejected with
        `403` before any event, place, or organization row is written.
        Authorization failures never mutate the database.
      tags: [Federation]
      security:
        - apiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-generated key that makes retries safe.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              type: object
              description: JSON-LD Event payload (`@context`, `@type`, `@id`, `name`, `startDate`, ...).
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event updated or unchanged
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/FederationSyncResponse'
        '201':
          description: Event created
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/FederationSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

