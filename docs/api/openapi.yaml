servers:
  - url: https://{node}
    description: SEL Node (paths include the `/api/v1` prefix; health, well-known and MCP endpoints live at the node root)
    variables:
      node:
        default: toronto.togather.foundation
        description: SEL node domain

tags:
  - name: Admin
    description: Administrative operations (requires admin auth)
  - name: Auth
    description: Authentication and token management
  - name: Developer
    description: Developer self-service API key management
  - name: Events
    description: Event discovery and submission
  - name: Federation
    description: Federation node management and inbound sync
  - name: Feeds
    description: Change feeds for federation
  - name: Geocoding
    description: Forward and reverse geocoding
  - name: Health
    description: Health check and build metadata endpoints
  - name: MCP
    description: Model Context Protocol streamable HTTP endpoint
  - name: Stats
    description: Public server statistics
  - name: OAuth
    description: GitHub OAuth authentication
  - name: Organizations
    description: Organizer information
  - name: Places
    description: Venue information

paths:
  /api/v1/events:
    get:
      operationId: listEvents
      summary: List events
      description: |
        Query events with optional filters. Returns paginated JSON-LD.
        For iCalendar output use `GET /api/v1/events.ics` (same filter params).
        A `Link: rel=alternate; type=text/calendar` header is included in the response
        pointing to the corresponding ICS feed URL.

        Each SEL node serves one configured geographic boundary (see
        GEOGRAPHIC_BOUNDARY_CONFIG_FILE, default configs/boundary.yaml). The `city`
        and `region` filters are interpreted against that boundary, not against
        per-event addressLocality data: a requested city/region within the node's
        configured localities/regions matches the whole node (all events are
        returned); one outside it matches nothing; a dimension the node does not
        configure is not filtered. When both are omitted, the node's configured
        scope applies.

        Only publicly visible events are returned. Publicly visible lifecycle
        states are `published`, `postponed`, `rescheduled`, `sold_out`, `cancelled`
        and `completed`; `draft`, `pending_review` and `deleted` events are never
        returned by this endpoint. Passing `state=draft` therefore yields an empty
        list (the explicit state intersects with the public allowlist). Admin
        clients must use `GET /api/v1/admin/events` to see every non-deleted
        lifecycle state.
      tags: [Events]
      security: []
      parameters:
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/city'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/venueId'
        - $ref: '#/components/parameters/organizerId'
        - $ref: '#/components/parameters/lifecycleState'
        - $ref: '#/components/parameters/eventDomain'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/keywords'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/context'
      responses:
        '200':
          description: Paginated list of events
          headers:
            Link:
              description: Pagination cursor (rel=next, RFC 8288) and alternate ICS feed URL (rel=alternate)
              schema:
                type: string
              example: </api/v1/events?after=ABC123&limit=50>; rel="next"
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      operationId: createEvent
      summary: Submit a new event
      description: |
        Submit a new event to the library. Requires agent or admin authentication.
        Events are auto-published immediately and appear in admin review queue
        if flagged or low-confidence.

        Events with ambiguous (inferred) years are validated against
        VALIDATION_AMBIGUOUS_DATE_MAX_FUTURE_DAYS (default 60 days in the future);
        those exceeding this threshold are sent to the review queue.
      tags: [Events]
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        description: Event data in JSON-LD or JSON format
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/EventInput'
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created successfully
          headers:
            Location:
              description: URI of the created event
              schema:
                type: string
                format: uri
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate event (idempotent - returns existing event)
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Event'

  /api/v1/events/{id}:
    get:
      operationId: getEvent
      summary: Get event by ID
      description: |
        Retrieve a single event by its ULID. Returns JSON-LD.
        For iCalendar output use `GET /api/v1/events/{id}/ics`.
        A `Link: rel=alternate; type=text/calendar` header is included in the response
        pointing to the corresponding ICS download URL.

        Only publicly visible events are served. `draft` and `pending_review`
        events return `404 Not Found` so their existence is not leaked. Deleted
        events that were publicly visible return `410 Gone` with a tombstone;
        deleted events that were never public (including rejected submissions)
        return `404 Not Found` so their existence is not leaked. Prior visibility
        is derived from recorded `event_changes` history; legacy rows without a
        recorded public lifecycle fail closed (404).
      tags: [Events]
      security: []
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: Event details
          headers:
            Link:
              description: Alternate ICS download URL for calendar clients (rel=alternate)
              schema:
                type: string
              example: </api/v1/events/{id}/ics>; rel="alternate"; type="text/calendar"
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Event was publicly visible and has been deleted; response carries the tombstone payload
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Tombstone'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/events:batch:
    post:
      operationId: createEventBatch
      summary: Submit multiple events in a batch
      description: |
        Submit multiple events for background processing. Returns immediately with a batch ID
        and job status URL. Use the batch status endpoint to check processing results.
        
        Maximum batch size: 100 events. Each event in the batch is processed independently,
        with individual success/failure tracking.
      tags: [Events]
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        description: Array of events for batch processing (max 100 events)
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/EventInput'
      responses:
        '202':
          description: Batch accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@context':
                    type: string
                  '@type':
                    type: string
                    enum: [BatchSubmission]
                  batch_id:
                    type: string
                    description: Unique identifier for this batch submission
                  job_id:
                    type: integer
                    description: River job queue ID
                  status:
                    type: string
                    enum: [processing]
                  status_url:
                    type: string
                    format: uri
                    description: URL to check batch processing status
                  submitted:
                    type: integer
                    description: Number of events in the batch
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/events.ics:
    get:
      operationId: listEventsICS
      summary: List events as iCalendar feed
      description: |
        Query events with optional filters and return as an iCalendar (ICS) feed.
        Same filter parameters as the JSON list endpoint.
        Returns a valid VCALENDAR even when no events match (empty feed).
        `city` and `region` are interpreted against the node's configured
        geographic boundary as described on the JSON list endpoint.

        The feed contains only publicly visible events (`published`, `postponed`,
        `rescheduled`, `sold_out`, `cancelled`, `completed`). `draft`,
        `pending_review` and `deleted` events are excluded.
      tags: [Events]
      security: []
      parameters:
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/city'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/venueId'
        - $ref: '#/components/parameters/organizerId'
        - $ref: '#/components/parameters/lifecycleState'
        - $ref: '#/components/parameters/eventDomain'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/keywords'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: iCalendar feed of events
          headers:
            Content-Disposition:
              description: Attachment filename for download
              schema:
                type: string
              example: attachment; filename="events.ics"
            Link:
              description: Pagination cursor for next page of results (RFC 8288)
              schema:
                type: string
              example: </api/v1/events.ics?after=ABC123&limit=50>; rel="next"
          content:
            text/calendar:
              schema:
                type: string
                description: iCalendar (RFC 5545) calendar data
        '400':
          description: Invalid filter parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/events/{id}/ics:
    get:
      operationId: getEventICS
      summary: Get event as iCalendar
      description: |
        Retrieve a single event by its ULID as an iCalendar (ICS) download.
        Useful for importing a specific event into calendar applications.

        Only publicly visible events are served. `draft` and `pending_review`
        events return `404 Not Found`. Deleted events that were publicly visible
        return `410 Gone` with a tombstone payload; deleted events that were
        never public return `404 Not Found` so their existence is not leaked.
        Prior visibility is derived from recorded `event_changes` history; legacy
        rows without a recorded public lifecycle fail closed (404).
      tags: [Events]
      security: []
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: iCalendar event
          headers:
            Content-Disposition:
              description: Attachment filename for download
              schema:
                type: string
              example: attachment; filename="event-{id}.ics"
          content:
            text/calendar:
              schema:
                type: string
                description: iCalendar (RFC 5545) calendar data
        '404':
          description: Event not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Event was publicly visible and has been deleted; response carries the tombstone payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/batch-status/{id}:
    get:
      operationId: getBatchStatus
      summary: Get batch processing status
      description: |
        Retrieve the status and results of a batch event submission. Returns 404 if
        the batch is still processing or doesn't exist.
      tags: [Events]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Batch ID returned from batch submission
      responses:
        '200':
          description: Batch processing completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@context':
                    type: string
                  '@type':
                    type: string
                    enum: [BatchSubmissionResult]
                  batch_id:
                    type: string
                  status:
                    type: string
                    enum: [completed]
                  completed_at:
                    type: string
                    format: date-time
                  total:
                    type: integer
                    description: Total number of events processed
                  created:
                    type: integer
                    description: Number of events successfully created
                  failed:
                    type: integer
                    description: Number of events that failed validation/processing
                  duplicates:
                    type: integer
                    description: Number of duplicate events detected
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Index of event in original batch array
                        status:
                          type: string
                          enum: [created, failed, duplicate]
                        event_id:
                          type: string
                          description: ULID of created/duplicate event (if successful)
                        error:
                          type: string
                          description: Error message (if failed)
        '404':
          description: Batch not found or still processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '410':
          $ref: '#/components/responses/Gone'

  /api/v1/places:
    get:
      operationId: listPlaces
      summary: List places
      description: |
        Query places (venues) with optional filters. Returns paginated JSON-LD.
        Supports proximity search via `near_lat` + `near_lon` (+ optional `radius`),
        or `near_place` to geocode a place name first.
      tags: [Places]
      security: []
      parameters:
        - $ref: '#/components/parameters/localityCity'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/nearPlace'
        - $ref: '#/components/parameters/nearLat'
        - $ref: '#/components/parameters/nearLon'
        - $ref: '#/components/parameters/radius'
        - $ref: '#/components/parameters/countrycodes'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of places
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'

  /api/v1/places/{id}:
    get:
      operationId: getPlace
      summary: Get place by ID
      description: Retrieve a single place (venue) by its unique identifier. Returns JSON-LD.
      tags: [Places]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the place (ULID or URI)
          schema:
            type: string
      responses:
        '200':
          description: Place details
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations
      description: Query organizations (event organizers) with optional filters. Returns paginated JSON-LD.
      tags: [Organizations]
      security: []
      parameters:
        - $ref: '#/components/parameters/localityCity'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of organizations
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'

  /api/v1/organizations/{id}:
    get:
      operationId: getOrganization
      summary: Get organization by ID
      description: Retrieve a single organization by its unique identifier. Returns JSON-LD.
      tags: [Organizations]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the organization (ULID or URI)
          schema:
            type: string
      responses:
        '200':
          description: Organization details
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/events/pending:
    get:
      operationId: listPendingEvents
      summary: List events awaiting review
      description: Returns events flagged for admin review (low confidence, validation issues, etc.)
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/city'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/venueId'
        - $ref: '#/components/parameters/organizerId'
        - $ref: '#/components/parameters/eventDomain'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/keywords'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of pending events
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/events/{id}:
    put:
      operationId: updateEvent
      summary: Update an event
      description: Admin endpoint to edit event details. Increments version and logs change.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        description: Updated event data with version for optimistic locking
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateInput'
      responses:
        '200':
          description: Event updated
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict (optimistic locking)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      operationId: deleteEvent
      summary: Delete an event
      description: Soft delete - returns 410 Gone with tombstone thereafter if the event was publicly visible; events that were never public return 404
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/events/consolidate:
    post:
      operationId: consolidateEvents
      summary: Atomically consolidate multiple events into one canonical event
      description: |
        Consolidate N events into a single canonical event in one atomic operation.
        Either creates a new canonical event (`event`) or promotes an existing one
        (`event_ulid`). All events listed in `retire` are soft-deleted with tombstones.
        Open review queue entries for retired events are dismissed automatically.

        Post-consolidation validation (duplicate detection, quality checks) runs on
        the canonical event; results are returned in `warnings`, `is_duplicate`, and
        `needs_review`. Near-duplicate detection after consolidation uses a similarity
        threshold configurable via DEDUP_NEAR_DUPLICATE_THRESHOLD (default 0.4).

        Exactly one of the following must hold:
        - `event_ulid` only: promote an existing event as canonical with no field changes.
        - `event_ulid` + `event`: promote an existing event as canonical AND apply field
          edits atomically inside the same transaction. Patchable fields: `name`,
          `description`, `url`, `image`, `keywords`, `eventDomain`. Fields ignored on the
          patch path: `startDate`, `endDate`, `doorTime`, `occurrences`, `source`,
          `lifecycle_state`, and scraper-only hints.
        - `event` only: create a new canonical event (full ingest pipeline).

        `retire` is required and must contain at least one ULID. The canonical event's
        ULID must not appear in the `retire` list.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - retire
              properties:
                event:
                  description: >
                    When `event_ulid` is absent: full event payload to create a new
                    canonical event. When `event_ulid` is present: partial patch applied
                    atomically to the promoted canonical event. Patchable fields: name,
                    description, url, image, keywords, eventDomain. Occurrence-derived
                    and ingest-only fields (startDate, endDate, occurrences, source,
                    lifecycle_state) are ignored on the patch path.
                  $ref: '#/components/schemas/EventInput'
                event_ulid:
                  type: string
                  description: >
                    ULID of an existing event to promote as the canonical event.
                    May be combined with `event` to apply field edits atomically.
                retire:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: >
                    Event ULIDs to soft-delete with tombstones. All must exist and
                    not already be deleted. Required, minimum 1 entry.
                transfer_occurrences:
                  type: boolean
                  default: false
                  description: >
                    If true, occurrences are copied from each retired event to the
                    canonical event before retirement. Returns 409 if any occurrence
                    would overlap an existing one on the canonical. Default false
                    (Merge Duplicate path — retire only, no occurrence transfer).
      responses:
        '200':
          description: Consolidation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateResponse'
        '400':
          description: |
            Invalid request. Possible reasons:
            - Neither `event` nor `event_ulid` was provided
            - `retire` list is empty or missing
            - Canonical event's ULID appears in `retire`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Retire target or canonical event not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            An occurrence from a retired event overlaps an existing occurrence on
            the canonical event (only when transfer_occurrences is true).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: |
            Unprocessable request. Possible reasons:
            - One or more retire targets are already deleted
            - The canonical event has been deleted
            - Validation error in the provided event payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

