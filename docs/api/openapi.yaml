          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/scraper/config:
    get:
      operationId: getScraperConfig
      summary: Get global scraper configuration
      description: |
        Returns the current global scraper configuration including concurrency limits,
        timeouts, retry settings, and rate limiting. If no config exists in the database,
        returns sensible defaults.
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current scraper configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScraperConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    patch:
      operationId: patchScraperConfig
      summary: Update global scraper configuration
      description: |
        Updates the global scraper configuration with partial JSON. Only provided fields
        are applied over the current config. All numeric fields must be greater than 0
        (except rate_limit_ms which can be 0).

        Validation rules:
        - max_concurrent_sources: must be > 0
        - request_timeout_seconds: must be > 0
        - retry_max_attempts: must be > 0
        - max_batch_size: must be > 0
        - rate_limit_ms: must be >= 0
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScraperConfigPatch'
      responses:
        '200':
          description: Updated scraper configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScraperConfig'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/scraper/trigger-all:
    post:
      operationId: triggerAllScraperSources
      summary: Trigger a serial scrape run for all eligible sources
      description: |
        Queues an orchestrator job that serially scrapes all enabled sources with
        daily or weekly schedules. Returns immediately with 202 after queuing.

        Serial chaining timeout behavior is configurable via:
        - `SCRAPER_SOURCE_JOB_TIMEOUT_SECONDS` (default 300)
        - `SCRAPER_CHAIN_ENQUEUE_TIMEOUT_MS` (default 5000)
        - `SCRAPER_CHAIN_ENQUEUE_RETRIES` (default 3)

        Options:
        - `respect_auto_scrape` (default: true): If true and global auto_scrape is disabled, skip the run
        - `skip_up_to_date` (default: true): Skip sources with fresh runs (daily <24h, weekly <7d)
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                respect_auto_scrape:
                  type: boolean
                  default: true
                skip_up_to_date:
                  type: boolean
                  default: true
      responses:
        '202':
          description: Orchestrator job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: triggered
                  respect_auto_scrape:
                    type: boolean
                  skip_up_to_date:
                    type: boolean
                  orchestrator_job_id:
                    type: integer
        '200':
          description: Run skipped (auto_scrape disabled and respect_auto_scrape=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: skipped
                  respect_auto_scrape:
                    type: boolean
                  skip_up_to_date:
                    type: boolean
        '409':
          description: Run already in progress; overlapping run-all is blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: already_running
                  respect_auto_scrape:
                    type: boolean
                  skip_up_to_date:
                    type: boolean
                  running_sources:
                    type: integer
                    minimum: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: |
            Job queue not available or orchestrator not configured.
            This can occur if:
            - The River job queue is unavailable on this node
            - The scraper orchestrator dependencies are not wired (e.g., River not initialized)
            Check that the server is configured with `RIVER_ENABLED=true` and the database
            schema includes River tables.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/scraper/submissions:
    post:
      operationId: submitURLs
      summary: Submit URLs for scraping
      description: |
        Submits up to 10 URLs for review and eventual scraping. No authentication
        required. Rate limited to 20 URLs per IP per 24 hours (configurable via
        `RATE_LIMIT_SUBMISSIONS_PER_IP_PER_24H`).

        Each URL is normalised and deduplicated before insertion. The response
        includes a per-URL result indicating whether the URL was accepted,
        already exists (duplicate), or rejected (invalid URL).
      tags: [Scraper]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  minItems: 1
                  maxItems: 10
                  example:
                    - https://www.toronto.ca/events-calendar/
            example:
              urls:
                - https://www.toronto.ca/events-calendar/
      responses:
        '200':
          description: Submission results, one entry per submitted URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubmissionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limit exceeded — retry after 24 hours
          headers:
            Retry-After:
              schema:
                type: integer
                example: 86400
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/scraper/events:
    get:
      operationId: streamScraperEvents
      summary: Stream scraper job events
      description: |
        Server-Sent Events stream of River job lifecycle events for scraper jobs.
        Clients receive events when scrape_source jobs complete, fail, or are cancelled.
        Maintains a keepalive comment every 15 seconds to prevent proxy timeouts.
        Protected by admin cookie auth (same-origin EventSource sends cookies automatically).
      tags: [Admin]
      x-internal: true
      security:
        - cookieAuth: []
      responses:
        '200':
          description: SSE stream of scraper job events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE stream. Each event has the form:
                    id: <job_id>
                    data: {"kind":"job_completed","job_kind":"scrape_source","source_name":"<name>","job_id":<id>}

                  Keepalive comments (`: keepalive`) are sent every 15 seconds.
                  A `retry: 5000` directive is sent on connection.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Streaming not supported

