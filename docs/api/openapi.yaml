        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/scraper/sources/{name}/diagnostics:
    get:
      operationId: getSourceDiagnostics
      summary: Get diagnostics for a scraper source
      description: |
        Returns the latest run, last successful run (for comparison when latest failed),
        and a configurable list of recent runs for the named scraper source.

        Smart default behavior:
        - Always includes the latest run
        - When the latest run failed, includes the last successful run for comparison
        - Returns empty response (200) if the source has no runs yet

        Query parameters:
        - `limit`: Number of recent runs to return (1–100, default 10)
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Scraper source name
          schema:
            type: string
        - name: limit
          in: query
          description: Number of recent runs to return (1–100, default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Source diagnostics with latest run, last success, and recent runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDiagnostics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
