    post:
      operationId: mcpStreamableHTTP
      summary: MCP streamable HTTP endpoint
      description: |
        Model Context Protocol endpoint (streamable HTTP transport, JSON-RPC 2.0).
        Read-only tools (`events`, `search`, `places`, `organizations`,
        `geocode_address`, `reverse_geocode`) are public; write/account tools
        require an API key. Sessions are established with `initialize`; the
        response `Mcp-Session-Id` header must be echoed on later calls.
      tags: [MCP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 request (`initialize`, `tools/list`, `tools/call`, ...).
              additionalProperties: true
      responses:
        '200':
          description: JSON-RPC response or SSE stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string

