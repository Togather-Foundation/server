  /api/v1/admin/scraper/diagnostics:
    get:
      operationId: getAllDiagnostics
      summary: Get cross-source scraper diagnostics
      description: |
        Returns recent scraper runs across all sources with optional filters.
        Useful for troubleshooting failures across multiple sources at once.

        Query parameters:
        - `limit`: Number of runs to return (1–100, default 20)
        - `status`: Filter by run status (failed, completed, running)
        - `source_name`: Filter by specific source name
      tags: [Admin]
      x-internal: true
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of runs to return (1–100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by run status
          schema:
            type: string
            enum: [failed, completed, running]
        - name: source_name
          in: query
          description: Filter by source name
          schema:
            type: string
      responses:
        '200':
          description: Filtered list of recent scraper runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllDiagnostics'
        '401':
