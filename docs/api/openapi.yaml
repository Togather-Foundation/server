  /api/v1/feeds/changes:
    get:
      operationId: getChangeFeed
      summary: Get change feed
      description: |
        Ordered stream of changes for federation sync. Returns events in 
        sequence order with action type and snapshot.

        This is the unconditional public feed. `draft` and `pending_review`
        changes are omitted entirely. A delete row is exposed only if the event was
        publicly visible at some earlier point; tombstones for submissions that
        never left draft/pending_review are not published. A deleted event's
        `create`/`update` rows are omitted, but its `delete` row is retained so
        consumers observe tombstones (Interop Profile §4.3). Snapshots are only
        attached to create/update rows that were recorded while the event was
        publicly visible and whose event is still public (rows with no recorded
        lifecycle fall back to the current event state); delete rows carry a
        tombstone payload only for previously-public events.

        Unpublishing (transition to `draft`) is not a deletion: it withdraws the
        event's create/update rows from the feed and emits no delete row. Consumers
        holding a copy must re-fetch `GET /api/v1/events/{ulid}` and treat `404` as
        withdrawal.

        Cursor/sequence ordering is preserved:
        filtering happens in SQL before `ORDER BY sequence_number`, and
        `next_cursor` walks only the rows that were returned.
      tags: [Feeds]
      security: []
      parameters:
        - name: since
          in: query
          description: |
            Pagination cursor from a previous response (e.g. `c2VxXzIwMA`), **or** an ISO 8601
            timestamp (e.g. `2026-06-01T20:00:00Z`) to return only changes ingested after that
            time. Cursor takes precedence when both interpretations are valid. Curator agents
            should store `next_cursor` from each response and pass it here on the next poll for
            efficient sequence-based pagination; on the first call an ISO timestamp can be used
            to bootstrap from a known point in time.
          schema:
            type: string
        - name: after
          in: query
          deprecated: true
          description: Legacy alias for `since` (kept for backward compatibility).
          schema:
            type: string
        - name: action
          in: query
          description: Filter by change type. Omit to receive every type.
          schema:
            type: string
            enum: [create, update, delete]
        - name: include_snapshot
          in: query
          description: |
            When `true`, each change embeds the full JSON-LD event snapshot.
            Snapshots are only attached to create/update rows that were recorded
            while the event was publicly visible and whose event is still public
            (rows with no recorded lifecycle fall back to the current event
            state). Delete rows carry a tombstone payload only for events that
            were publicly visible at some earlier point, so `include_snapshot` is
            safe for anonymous consumers.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Change feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeedResponse'

